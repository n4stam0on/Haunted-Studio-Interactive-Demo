<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Haunted Studio</title>
<meta name="description" content="An interactive incident response simulator based on real attacks on game studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Pirata+One&display=swap">
<style>
/* Layout: one security-console column. Header holds the studio badge and a 4-step station tracker; each station is one working panel. Deliberately single (dark) theme: a night-shift console. */
:root{
  --night:#17121f; --panel:#211a2c; --panel-2:#2b2238; --line:#3e3252;
  --bone:#efe6d8; --dim:#b2a7c3; --pumpkin:#f0883e; --pumpkin-ink:#1f1308;
  --ecto:#6fd3b5; --amber:#e9b949; --blood:#f0695e;
  --pumpkin-wash:rgba(240,136,62,.14); --ecto-wash:rgba(111,211,181,.13); --blood-wash:rgba(240,105,94,.14); --amber-wash:rgba(233,185,73,.14);
  --f-display:"Pirata One", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--bone)}
body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1060px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;color:var(--pumpkin);letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.steps li.done{color:var(--ecto);border-color:color-mix(in srgb,var(--ecto) 45%,transparent)}
.steps li.now{color:var(--pumpkin-ink);background:var(--pumpkin);border-color:var(--pumpkin);font-weight:600}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,76px);line-height:.95;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,42px);line-height:1.05}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:66ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin)}
.muted{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack-lg{display:flex;flex-direction:column;gap:24px;min-width:0}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:17px;background:var(--pumpkin);color:var(--pumpkin-ink);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--dim)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;color:var(--dim)}
.brief b{color:var(--bone);font-weight:600}
.brief .alert{color:var(--blood)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s ease,background .15s ease}
.case:hover{border-color:var(--pumpkin);background:var(--panel-2)}
.case .file{font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.case h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05}
.case p{font-size:15px;color:var(--dim)}
.pill{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.d-Easy{color:var(--ecto)} .d-Medium{color:var(--amber)} .d-Hard{color:var(--blood)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--bone)}

/* station panel */
.station-head{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}

/* messages */
.msg{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.msg-meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.line b{font-family:var(--f-mono);font-size:13px;color:var(--pumpkin);padding-top:2px}
.ehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ehead dt{color:var(--dim);font-family:var(--f-mono);font-size:12.5px;padding-top:2px}
.ehead dd{margin:0;overflow-wrap:anywhere}
.attach{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start}
.bubble{background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:34ch;overflow-wrap:anywhere}
.bubble u{color:var(--amber)}
.chatname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--amber-wash);color:var(--amber)}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;transition:border-color .15s ease}
.choice:hover:not([disabled]){border-color:var(--pumpkin)}
.choice[disabled]{cursor:default}
.key{font-family:var(--f-mono);font-weight:600;font-size:13px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.choice.v-best{border-color:var(--ecto);background:var(--ecto-wash)}
.choice.v-bad.picked{border-color:var(--blood);background:var(--blood-wash)}
.choice.v-ok.picked{border-color:var(--amber);background:var(--amber-wash)}
.choice.dimmed{opacity:.55}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.best{background:var(--ecto-wash)} .fb.ok{background:var(--amber-wash)} .fb.bad{background:var(--blood-wash)}
.verdict{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.best .verdict{color:var(--ecto)} .ok .verdict{color:var(--amber)} .bad .verdict{color:var(--blood)}

/* logs */
.logwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--night)}
table.logs{border-collapse:collapse;width:100%;min-width:760px;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.logs th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.logs td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.logs tr:last-child td{border-bottom:0}
.row{cursor:pointer;transition:background .12s ease}
.row:hover{background:var(--panel)}
.row.sel{background:var(--pumpkin-wash)}
.row.locked{opacity:.45;cursor:not-allowed}
.row.locked:hover{background:transparent}
.row.sel td:first-child .box{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--pumpkin-ink)}
.box{width:20px;height:20px;border:1.5px solid var(--dim);border-radius:5px;display:grid;place-items:center;font-size:13px;line-height:1}
.graded .row{cursor:default}
.row.hit{background:var(--ecto-wash)} .row.miss{background:var(--amber-wash)} .row.false{background:var(--blood-wash)}
.why td{font-family:var(--f-body);font-size:14.5px;color:var(--bone);padding-top:0;padding-bottom:12px}
.why .verdict{margin-right:8px}
.why.hit .verdict{color:var(--ecto)} .why.miss .verdict{color:var(--amber)} .why.false .verdict{color:var(--blood)}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:13.5px}
.tally span b{font-weight:600}

/* actions */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease}
.act:hover:not([disabled]){border-color:var(--pumpkin)}
.act.sel{border-color:var(--pumpkin);background:var(--pumpkin-wash)}
.act[disabled]{cursor:default}
.act.good.sel{border-color:var(--ecto);background:var(--ecto-wash)}
.act.badpick{border-color:var(--blood);background:var(--blood-wash)}
.act.missed{border-style:dashed;border-color:var(--ecto)}
.act .why2{font-size:14.5px;color:var(--dim)}
.picked-n{font-family:var(--f-mono);font-size:13px;color:var(--dim)}

/* result */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chain li{border-radius:10px;padding:10px 10px 12px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.chain .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.chain .k{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.chain .p{font-size:12.5px;color:var(--dim);line-height:1.3}
.chain li.reached{background:var(--blood-wash);border-color:color-mix(in srgb,var(--blood) 50%,transparent)}
.chain li.reached .n{color:var(--blood)}
.chain li.stop{background:var(--ecto-wash);border:2px solid var(--ecto)}
.chain li.stop .n{color:var(--ecto)}
.score{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:var(--panel-2);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:140px}
.stat b{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--dim)}
.reveal{background:var(--bone);color:var(--pumpkin-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.reveal .eyebrow{color:#9a4a12}
.reveal h2{color:var(--pumpkin-ink)}
.reveal p{color:#2b2233}
.reveal .lesson{font-weight:700}
.ttps{display:flex;flex-wrap:wrap;gap:8px}
.ttp{font-family:var(--f-mono);font-size:12.5px;background:#e3d7c4;color:#2b2233;border-radius:6px;padding:4px 8px}
.ttp b{font-weight:600}
.fineprint{font-size:13px;color:#5b5165}

/* team mode */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--bone)}
.teamform{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.field input{font:inherit;font-size:16px;color:var(--bone);background:var(--night);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.field input:focus{outline:2px solid var(--amber);outline-offset:1px}
.formnote{grid-column:1/-1;font-size:14px;color:var(--dim)}
.formnote.err{color:var(--blood)}
.onpoint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--pumpkin-wash);border-radius:12px;padding:12px 16px}
.onpoint .who{font-size:19px;font-weight:700}
.onpoint .role{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pumpkin)}
.onpoint p{flex-basis:100%;font-size:15px;color:var(--bone)}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.roster span{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:14.5px}
.roster i{font-style:normal;color:var(--dim);font-size:13px}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{text-align:left;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.board td{padding:9px 10px;border-bottom:1px solid var(--line)}
.board tr.you td{color:var(--pumpkin);font-weight:700}
.board td.num{font-family:var(--f-mono);text-align:right}
/* station 1 flags, notes, later picks */
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px;line-height:1.3;transition:border-color .15s ease}
.flag:hover{border-color:var(--pumpkin)}
.flag.sel{background:var(--pumpkin-wash);border-color:var(--pumpkin)}
.flag.sel::before{content:"⚑ ";color:var(--pumpkin)}
.flagres{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flagres summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.flaglist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.flaglist li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;font-size:14.5px}
.flaglist li span:last-child{color:var(--dim)}
.flaglist li.hit{background:var(--ecto-wash)} .flaglist li.hit .verdict{color:var(--ecto)}
.flaglist li.miss{background:var(--amber-wash)} .flaglist li.miss .verdict{color:var(--amber)}
.flaglist li.false{background:var(--blood-wash)} .flaglist li.false .verdict{color:var(--blood)}
.flaglist li.clean .verdict{color:var(--dim)}
.notes{background:var(--amber-wash);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.act.laterpick{border-color:var(--amber);background:var(--amber-wash)}
@media (max-width:820px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:minmax(0,1fr)}
}
/* message animations */
.typing{display:inline-flex;gap:5px;align-items:center;background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:13px 15px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:dots 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes dots{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.typing-label{font-size:13px;color:var(--dim);font-style:italic}
.pop{animation:pop .42s cubic-bezier(.2,.9,.3,1.35) both;transform-origin:bottom left}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(10px)}to{opacity:1;transform:none}}
.caret::after{content:"▍";color:var(--pumpkin);margin-left:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--blood)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blood);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.skiphint{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.msg.playing{cursor:pointer}
.wait{opacity:0;transition:opacity .45s ease}
/* envelope intro */
.envelope{position:relative;width:min(260px,72%);aspect-ratio:3/2;margin:52px auto 34px;perspective:700px;opacity:0;transform:translateY(-24px) scale(.9);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1.3)}
.envelope.arrived{opacity:1;transform:none}
.envelope.shake{animation:envshake .55s ease-in-out 2}
@keyframes envshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg) translateX(-4px)}35%{transform:rotate(6deg) translateX(4px)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.env-back,.env-front,.env-flap,.env-letter{position:absolute}
.env-back{inset:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;z-index:1}
.env-letter{left:9%;right:9%;top:9%;height:78%;background:var(--bone);border-radius:6px;z-index:2;padding:16% 12% 0;display:flex;flex-direction:column;gap:9%;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.env-letter i{display:block;height:7%;border-radius:3px;background:#cfc3b0}
.env-letter i:nth-child(2){width:80%} .env-letter i:nth-child(3){width:55%}
.env-front{inset:0;z-index:3;background:color-mix(in srgb,var(--panel-2) 82%,var(--bone));border-radius:10px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-flap{left:0;right:0;top:0;height:58%;z-index:4;background:color-mix(in srgb,var(--panel-2) 70%,var(--bone));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .55s ease,z-index 0s .27s}
.env-seal{position:absolute;left:50%;bottom:6%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--pumpkin);box-shadow:0 0 0 3px color-mix(in srgb,var(--pumpkin) 35%,transparent)}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.rise .env-letter{transform:translateY(-48%)}
.env-badge{position:absolute;top:-12px;right:-12px;z-index:5;background:var(--blood);color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;animation:pulse 1.4s infinite}
.risein{animation:risein .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes risein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.fadein{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* auto-analyst */
.bot{display:inline-block;margin-top:6px;font-size:10px;font-weight:600;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:var(--panel-2);color:var(--ecto);border:1px solid color-mix(in srgb,var(--ecto) 45%,transparent)}
.auto{background:var(--night);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.auto-head{display:flex;flex-direction:column;gap:6px}
.auto code{font-family:var(--f-mono);font-size:13px;background:var(--panel-2);padding:1px 6px;border-radius:5px}

.ttp-sm{font-family:var(--f-mono);font-size:11.5px;background:var(--panel-2);border-radius:4px;padding:1px 5px}
.alert-why{color:var(--dim)}
.build{font-family:var(--f-mono);font-size:12px}

/* station 1: evidence tools */
.evid{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.evid-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* station 2: investigation tools */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

.mono{font-family:var(--f-mono);font-size:16px}

.kv dt{color:var(--dim);font-family:var(--f-mono);font-size:12.5px;padding-top:2px}
.kv dd{margin:0}
.btn-sm{padding:8px 14px;font-size:14.5px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* station 3: live containment */
.live-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}

.feedlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}

.feedlist li.blocked{background:var(--ecto-wash)} .feedlist li.blocked .verdict{color:var(--ecto)}

/* station 4: timeline */
.pool{display:flex;flex-direction:column;gap:8px}
.tcard{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px;transition:border-color .15s ease}

.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

.cellbtn{white-space:nowrap}

/* station 3: IT console */

.ctool svg,.cpane-head svg{width:18px;height:18px;flex:none}
.ctool:hover{color:var(--bone);background:var(--panel)}
.ctool.on{color:var(--bone);background:var(--panel-2);box-shadow:inset 3px 0 0 var(--pumpkin)}

.cbtns{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13.5px;font-weight:700;white-space:nowrap}

.dir{display:grid;grid-template-columns:minmax(120px,150px) minmax(0,1fr);gap:14px}
.userlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow-y:auto}
.ubtn{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:1px}

.ubtn.on{background:var(--panel-2);border-color:var(--pumpkin)}
.udetail{display:flex;flex-direction:column;gap:10px;min-width:0}
.sub{display:flex;flex-direction:column;gap:4px}
.plain{margin:0;padding-left:18px;font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rows li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;background:var(--panel-2);border-radius:10px;padding:10px 12px}

.rows li span{font-size:13.5px;color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--ecto)}
.dot.bad{background:var(--blood)} .dot.warn{background:var(--amber)}

.doc ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.feedlist li.wasted .verdict{color:var(--dim)}
.plain-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.plain-ol li{display:flex;flex-direction:column;gap:2px}
.evtool{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-right:8px}
.live-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:980px){.live-grid{grid-template-columns:minmax(0,1fr)}.feed{position:static}}
@media (max-width:640px){.console{grid-template-columns:minmax(0,1fr)}.cnav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.ctool span{white-space:nowrap}.dir{grid-template-columns:minmax(0,1fr)}.userlist{max-height:200px}}

.amap .n>circle:first-child{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5}

.amap .tag text{font-family:var(--f-mono);font-size:8.5px;font-weight:600;letter-spacing:.06em;text-anchor:middle}
.amap .tag.ok rect{fill:var(--night);stroke:var(--ecto)} .amap .tag.ok text{fill:var(--ecto)}
.amap .tag.bad rect{fill:var(--night);stroke:var(--blood)} .amap .tag.bad text{fill:var(--blood)}
.amap .pulse{filter:drop-shadow(0 0 6px currentColor)}
.amap .burst{fill:none;stroke:var(--ecto);stroke-width:3;animation:burst .6s ease-out forwards}
@keyframes burst{to{r:26;opacity:0;stroke-width:1}}
.amap .burst-t,.amap .noeffect{font-family:var(--f-mono);font-size:11px;font-weight:600;text-anchor:middle;animation:floatup .7s ease-out forwards}
.amap .burst-t{fill:var(--ecto)} .amap .noeffect{fill:var(--dim)}
@keyframes floatup{from{opacity:0;transform:translateY(4px)}30%{opacity:1}to{opacity:1;transform:translateY(-4px)}}
.amap .flash-ok>circle:first-child{animation:flashok .9s ease-out}
.amap .flash-bad>circle:first-child{animation:flashbad .9s ease-out}
@keyframes flashok{0%{stroke-width:8}100%{stroke-width:2}}
@keyframes flashbad{0%{stroke-width:9;fill:var(--blood)}100%{stroke-width:2}}
.mapcap{font-size:14px;min-height:2.6em;margin:0}
.c-bad{color:var(--blood)} .c-ok{color:var(--ecto)} .c-dim{color:var(--dim)} .c-warn{color:var(--amber)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:3px;border-radius:2px}
.lg.bad{background:var(--blood)} .lg.ok{background:var(--ecto)} .lg.hit{width:9px;height:9px;border-radius:50%;background:var(--blood-wash);border:1.5px solid var(--blood)}

e build is. The attacker is looking around."}, {"c": ["12:07 AM", "m.vane", "Bucharest, Romania", "Unknown Linux device", "Download build_final.zip (38 GB)", "Success"], "s": true, "w": "The unreleased game walking out the door. This is the leak."}, {"c": ["12:10 AM", "k.tran", "San Antonio, TX", "Windows laptop (known)", "Sign in", "Failed: wrong password"], "s": false, "w": "A single typo from a known device."}, {"c": ["12:15 AM", "d.nguyen", "Frankfurt (company VPN)", "Windows laptop (known)", "Sign in", "Success"], "s": false, "w": "The notes say the company VPN shows up as Frankfurt. Known device, normal overnight work."}], "profiles": {"m.vane": {"role": "Senior Engine Programmer", "usual": "San Antonio, TX", "devices": "Windows laptop, iPhone (+1 210)", "note": "No travel on file. Last MFA change: 14 months ago."}, "j.cole": {"role": "Audio Designer", "usual": "San Antonio, TX", "devices": "MacBook, iPhone", "note": "Approved vacation: Mexico City, this week."}, "a.rios": {"role": "QA Lead", "usual": "Austin, TX", "devices": "MacBook", "note": "Works remotely from Austin."}, "k.tran": {"role": "Producer", "usual": "San Antonio, TX", "devices": "Windows laptop", "note": "No recent issues."}, "d.nguyen": {"role": "Night-shift Live Ops", "usual": "San Antonio, TX (via company VPN)", "devices": "Windows laptop", "note": "Always connects through the company VPN."}, "svc-build": {"role": "Service account · build automation", "usual": "Data center", "devices": "Build server", "note": "Runs the nightly build."}, "svc-backup": {"role": "Service account · backups", "usual": "Data center", "devices": "Backup server", "note": "Nightly backup at 11:30 PM, usually 150 to 250 GB."}}, "lookups": {"San Antonio, TX": "Residential and office internet in San Antonio. Matches most staff.", "Mexico City, Mexico": "Hotel Wi-Fi in Mexico City.", "Austin, TX": "Residential internet in Austin.", "Bucharest, Romania": "185.220.x.x · rented server (hosting provider). Not a home or office connection.", "Frankfurt (company VPN)": "Graveyard Games VPN gateway in Frankfurt.", "Data center": "Company data center.", "Help desk portal": "Internal help desk tool. Actions are taken by a help desk agent."}}, "s3": {"intro": "The attacker is inside Marcus's account right now. Pick the 3 moves you make first.", "acts": [{"t": "End all of Marcus's active sessions", "g": "now", "w": "Kicks the attacker out of every place they're logged in right now.", "do": ["directory|m.vane|revoke"], "fx": {"cut": [["atk", "acct"]], "say": "Sessions revoked. The attacker's sign-in is cut."}}, {"t": "Remove the +40 phone and lock the account until the real Marcus is verified", "g": "now", "w": "Takes back the keys the help desk was tricked into handing over.", "do": ["directory|m.vane|removemfa", "directory|m.vane|disable"], "fx": {"cut": [["phone", "acct"]], "guard": {"acct": "Locked"}, "say": "+40 phone removed and the account is locked."}}, {"t": "Block the unknown device from the build server", "g": "now", "w": "Stops any more of the game from leaving.", "do": ["network|Bucharest, Romania|block"], "fx": {"cut": [["acct", "build"]], "say": "The build server is blocked to the attacker."}}, {"t": "Tell the producers the build may have leaked", "g": "later", "w": "They need to know soon, but stop the attacker first, then brief them with facts.", "do": ["desk"]}, {"t": "Retrain the help desk on the callback policy", "g": "later", "w": "Important to prevent a repeat, but it doesn't stop tonight's attacker.", "do": ["desk"]}, {"t": "Reset every employee's password company-wide right now", "g": "bad", "w": "Locks out the whole studio three days before launch. The attacker is in one account; act on that one.", "do": ["directory|*|resetall"]}, {"t": "Delete the logs so the leak details don't spread", "g": "bad", "w": "Logs are your evidence. Deleting them helps the attacker.", "do": ["desk"]}, {"t": "Wait until morning to tell the security team", "g": "bad", "w": "Every hour you wait, the attacker keeps working.", "do": ["desk"]}], "feed": [{"t": "Searches #engine-builds chat for the build location", "by": [0, 1], "path": ["atk", "acct", "chat"]}, {"t": "Starts downloading build_final.zip (38 GB)", "by": [2, 1], "path": ["atk", "phone", "acct", "build"]}, {"t": "Signs back in using the +40 phone", "by": [1], "path": ["atk", "phone", "acct"]}, {"t": "Downloads the launch trailer and press kit", "by": [0, 1], "path": ["atk", "acct", "press"]}, {"t": "Adds a second MFA device for backup access", "by": [1], "path": ["atk", "phone", "acct"]}, {"t": "Downloads the engine source code", "by": [2, 1], "path": ["atk", "phone", "acct", "build"]}], "map": {"nodes": [{"id": "atk", "l": "Attacker", "k": "atk", "x": 48, "y": 62}, {"id": "phone", "l": "+40 phone", "k": "device", "x": 48, "y": 178}, {"id": "acct", "l": "m.vane", "k": "account", "x": 170, "y": 120}, {"id": "chat", "l": "#engine-builds", "k": "data", "x": 300, "y": 40}, {"id": "press", "l": "Press kit", "k": "data", "x": 345, "y": 120}, {"id": "build", "l": "Build server", "k": "server", "x": 300, "y": 200}, {"id": "soc", "l": "You (SOC)", "k": "soc", "x": 170, "y": 225}]}}, "s4": {"opts": [{"t": "An attacker posed as Marcus on the phone, got his MFA reset, and downloaded the launch build at 12:07 AM. The attacker is cut off and his account is locked. We're confirming what else was accessed.", "best": true, "f": "Accurate, specific, says what's been done, and is honest about what's still unknown."}, {"t": "Marcus Vane leaked the launch build last night. We recommend involving HR.", "best": false, "f": "Marcus is the victim. Blaming him is wrong and teaches people to hide mistakes."}, {"t": "Hackers in Romania broke into our servers using an advanced exploit.", "best": false, "f": "No exploit was used; they talked their way in. And an IP location doesn't prove who's behind it."}, {"t": "There was a minor login issue overnight. No action needed.", "best": false, "f": "The launch build left the building. Downplaying it leaves leadership unprepared."}]}, "reveal": {"company": "Electronic Arts", "year": "2021", "summary": "In June 2021, attackers broke into EA. News reports said they bought a stolen login cookie online, used it to get into the company's Slack, then messaged IT support pretending to be an employee who had lost their phone. Support gave them a login token, and they took source code for FIFA 21 and the Frostbite game engine.", "lesson": "Verify identity through a channel you already trust, not the one the request came from.", "ttps": [["T1539", "Steal Web Session Cookie"], ["T1656", "Impersonation"], ["T1078", "Valid Accounts"]]}, "timeline": [{"t": "Finds Marcus's name and team on LinkedIn", "s": [0]}, {"t": "Calls the help desk pretending to be Marcus", "s": [2]}, {"t": "Help desk resets the MFA and enrolls the attacker's phone", "s": [3, 4]}, {"t": "Signs in from Romania on a new device", "s": [4, 5]}, {"t": "Downloads the unreleased launch build", "s": [6]}], "console": {"tools": ["directory", "network", "desk", "docs"], "docs": ["acct", "mfa"], "mfa": {"m.vane": ["iPhone (+1 210) · enrolled 2025", "Phone (+40 742 555 019) · enrolled tonight, 11:52 PM"]}, "globals": {"directory": [{"verb": "resetall", "label": "Force a password reset for ALL users"}]}, "network": [{"target": "Bucharest, Romania", "note": "185.220.x.x · rented hosting server"}, {"target": "Mexico City, Mexico", "note": "Hotel Wi-Fi"}, {"target": "Frankfurt (company VPN)", "note": "Company VPN gateway"}], "nofx": {"directory|m.vane|reset": "Password reset, but the attacker signs in with the +40 phone they enrolled. Still inside.", "directory|m.vane|wipe": "You wiped Marcus's real iPhone. The attacker's phone is a different device.", "network|Frankfurt (company VPN)|block": "You cut off every overnight employee on the VPN. The attacker isn't using it.", "network|Mexico City, Mexico|block": "j.cole is locked out on vacation. The attacker isn't there."}}}, {"id": "launcher", "file": "CASE 0666", "title": "The Cursed Launcher", "diff": "Medium", "teaser": "Players get an email from official support with a brand-new game launcher.", "s1": {"role": "You are a Graveyard Games player checking your inbox.", "msg": {"type": "email", "from": "Graveyard Games Support &lt;support@graveyardgames.com&gt;", "to": "you", "subject": "Action required: install the new Graveyard Launcher", "attach": null, "body": "Hi Player, our old launcher will stop working this weekend. To keep your account and in-game items safe, download and install the new Graveyard Launcher from the link below before Friday."}, "flags": [{"t": "It sets a deadline (\"before Friday\")", "r": true, "w": "Deadlines push you to act before you think."}, {"t": "It asks you to install software from an email link", "r": true, "w": "Real game updates come through the launcher or store you already use, not an email download."}, {"t": "It says your account and items are at risk", "r": true, "w": "Fear of losing something valuable is a classic pressure tactic."}, {"t": "It came from the real support@graveyardgames.com address", "r": false, "w": "The address is real, so by itself it isn't a red flag. That's what makes this attack dangerous."}, {"t": "It greets you as \"Player\" instead of your name", "r": false, "w": "Mass emails often say \"Player\". Real support does it too, so it doesn't tell you much."}, {"t": "It has the studio's normal logo and formatting", "r": false, "w": "Looking official isn't a warning sign, and it isn't proof either."}], "q": "What do you do?", "opts": [{"t": ["Install it. The sender address is the studio's real support address.", "Download it, since it really did come from official support."], "v": "bad", "pts": 0, "f": "A real address only proves which system sent it. If that system is compromised, the attacker sends from it too."}, {"t": ["Check the official website and social accounts for a launcher announcement.", "Look for the launcher news on the studio's official site and socials first."], "v": "best", "pts": 3, "f": "Confirming through a separate official channel catches a compromised sender. No announcement anywhere else is a big red flag."}, {"t": ["Reply to support and ask whether the email is legitimate.", "Hit reply and ask support to confirm the email is real."], "v": "ok", "pts": 1, "f": "Good instinct, but the reply goes to the same compromised system, so the attacker may answer you."}, {"t": ["Scan the download with antivirus, then install it if it comes back clean.", "Run the file through your antivirus first and install it only if it's clean."], "v": "ok", "pts": 1, "f": "Antivirus helps, but new or repackaged malware often isn't detected yet. A clean scan isn't a green light."}], "evidence": [{"b": "Hover over the download link", "t": "Real link address", "f": "files-graveyardgames.com/launcher.exe. Official downloads only come from graveyardgames.com/download.", "tool": "Mail security"}, {"b": "View the full email headers", "t": "Email headers", "f": "Sent through the real support platform by agent account vendor.oscar. The system is real; the sender might not be.", "tool": "Mail security"}, {"b": "Check the official news page", "t": "Official news", "f": "No launcher announcement. The last post is patch notes from two weeks ago.", "tool": "Web"}, {"b": "Check the download's signature", "t": "File details", "f": "launcher.exe · 2.1 MB · not digitally signed by Graveyard Games.", "tool": "Endpoint"}]}, "s2": {"source": "Support platform · admin activity log", "intro": "Thousands of players got that email. Find the entries showing how the attacker used your support system.", "notes": ["Vendor agents work from the Manila office and are not allowed to use personal VPNs.", "Support sends templated replies to large groups of players during outages.", "Official downloads only come from graveyardgames.com/download."], "cols": ["Time", "Account", "Location", "Device", "Event", "Result"], "rows": [{"c": ["2:14 PM", "agent.dana", "San Antonio, TX", "Office PC (known)", "Sign in", "Success"], "s": false, "w": "A support agent starting her shift."}, {"c": ["2:30 PM", "agent.dana", "San Antonio, TX", "Office PC (known)", "Sent outage reply to 340 players", "Success"], "s": false, "w": "The notes say templated outage replies are normal."}, {"c": ["2:50 PM", "vendor.oscar", "Manila, Philippines", "Vendor office PC (known)", "Sign in", "Success"], "s": false, "w": "An outsourced agent signing in from his normal office."}, {"c": ["2:58 PM", "vendor.oscar", "Manila, Philippines", "Vendor office PC (known)", "Closed ticket #8790", "Success"], "s": false, "w": "Normal support work."}, {"c": ["3:02 PM", "vendor.oscar", "Amsterdam (VPN service)", "Unknown device", "Sign in", "Success"], "s": true, "w": "Same account, another continent 12 minutes later, on a VPN vendors aren't allowed to use."}, {"c": ["3:03 PM", "vendor.oscar", "Amsterdam (VPN service)", "Unknown device", "Opened admin settings: email templates", "Success"], "s": true, "w": "Support agents answer tickets. Poking at admin settings is out of place."}, {"c": ["3:05 PM", "vendor.oscar", "Amsterdam (VPN service)", "Unknown device", "Created template \"New Launcher\"", "Success"], "s": true, "w": "There's no launcher update. The attacker is writing the bait."}, {"c": ["3:07 PM", "vendor.oscar", "Amsterdam (VPN service)", "Unknown device", "Added link: files-graveyardgames.com/launcher.exe", "Success"], "s": true, "w": "A lookalike domain. Official downloads only come from graveyardgames.com/download."}, {"c": ["3:09 PM", "vendor.oscar", "Amsterdam (VPN service)", "Unknown device", "Bulk email sent to 48,000 players", "Success"], "s": true, "w": "The trap going out to every player at once."}, {"c": ["3:15 PM", "agent.mia", "San Antonio, TX", "Office PC (known)", "Sign in", "Failed: password expired"], "s": false, "w": "Routine. Passwords expire."}, {"c": ["3:16 PM", "agent.mia", "San Antonio, TX", "Office PC (known)", "Password changed", "Success"], "s": false, "w": "Mia fixing her expired password."}, {"c": ["3:30 PM", "agent.dana", "San Antonio, TX", "Office PC (known)", "Closed ticket #8812", "Success"], "s": false, "w": "Normal support work."}, {"c": ["3:40 PM", "vendor.oscar", "Manila, Philippines", "Vendor office PC (known)", "Closed ticket #8815", "Success"], "s": false, "w": "This is the real Oscar, still working from Manila. Two places at once is your clue his login was stolen."}], "profiles": {"agent.dana": {"role": "Player Support Agent", "usual": "San Antonio, TX", "devices": "Office PC", "note": "Sends templated outage replies."}, "agent.mia": {"role": "Player Support Agent", "usual": "San Antonio, TX", "devices": "Office PC", "note": "Password expired today."}, "vendor.oscar": {"role": "Outsourced Support Agent (vendor)", "usual": "Manila, Philippines", "devices": "Vendor office PC", "note": "Vendor policy: no personal VPNs. Should never edit email templates."}}, "lookups": {"San Antonio, TX": "Graveyard Games office network.", "Manila, Philippines": "Support vendor's office network. Matches vendor.oscar's usual location.", "Amsterdam (VPN service)": "Consumer VPN service. Hides where the user really is."}}, "s3": {"intro": "The fake launcher steals saved passwords from players' computers. Pick your 3 first moves.", "acts": [{"t": "End all of vendor.oscar's sessions and reset his password", "g": "now", "w": "Cuts the attacker out of your support system.", "do": ["directory|vendor.oscar|revoke", "directory|vendor.oscar|reset", "directory|vendor.oscar|disable"], "fx": {"cut": [["atk", "vacct"]], "guard": {"vacct": "Disabled"}, "say": "vendor.oscar is cut off and disabled."}}, {"t": "Block the lookalike download link", "g": "now", "w": "Stops new victims, even if some players still click.", "do": ["network|files-graveyardgames.com|block"], "fx": {"guard": {"link": "Blocked"}, "say": "The fake download link is blocked."}}, {"t": "Warn players on official channels: don't run it, reset passwords, turn on MFA", "g": "now", "w": "Protects the people who already got the email.", "do": ["desk"], "fx": {"cut": [["players", "creds"]], "say": "Players are warned to reset passwords, so stolen ones stop working."}}, {"t": "Review which other vendor accounts can send bulk email", "g": "later", "w": "Smart cleanup, but first stop the active damage.", "do": ["desk"]}, {"t": "Offer account recovery help to affected players", "g": "later", "w": "Kind and useful once the bleeding has stopped.", "do": ["desk"]}, {"t": "Shut down the support system for good", "g": "bad", "w": "An overreaction. Contain the one bad account; players still need support.", "do": ["desk"]}, {"t": "Ask players to reply with their passwords so you can check their accounts", "g": "bad", "w": "Never ask for passwords. That's exactly what attackers do.", "do": ["desk"]}, {"t": "Email all players a link to a \"fixed\" launcher", "g": "bad", "w": "A second surprise download email trains players to keep clicking. Point them to the official site instead.", "do": ["desk"]}], "feed": [{"t": "Sends a second wave of the email to 12,000 more players", "by": [0], "path": ["atk", "vacct", "supp"]}, {"t": "400 more players download launcher.exe", "by": [1], "path": ["atk", "link", "players"]}, {"t": "Stolen passwords start arriving at the attacker's server", "by": [2], "path": ["players", "creds", "atk"]}, {"t": "Posts the fake launcher in the official forum as Support", "by": [0], "path": ["atk", "vacct", "forum"]}, {"t": "800 more players run the launcher", "by": [1, 2], "path": ["atk", "link", "players", "creds"]}, {"t": "Logs into 300 player accounts and sells their rare items", "by": [2], "path": ["atk", "creds", "players"]}], "map": {"nodes": [{"id": "atk", "l": "Attacker", "k": "atk", "x": 48, "y": 62}, {"id": "vacct", "l": "vendor.oscar", "k": "account", "x": 160, "y": 40}, {"id": "supp", "l": "Support system", "k": "server", "x": 270, "y": 40}, {"id": "forum", "l": "Official forum", "k": "data", "x": 355, "y": 110}, {"id": "link", "l": "Fake download", "k": "data", "x": 160, "y": 140}, {"id": "players", "l": "Players", "k": "people", "x": 270, "y": 160}, {"id": "creds", "l": "Player passwords", "k": "data", "x": 330, "y": 225}, {"id": "soc", "l": "You (SOC)", "k": "soc", "x": 60, "y": 215}]}}, "s4": {"opts": [{"t": "An attacker used a vendor's stolen support login to email 48,000 players a fake launcher that steals passwords. The account is disabled and the link is blocked. We're warning players to reset passwords and turn on MFA.", "best": true, "f": "Clear, accurate, includes what's done and what players should do."}, {"t": "Our support vendor accidentally sent a buggy launcher update to some players.", "best": false, "f": "It wasn't an accident or a bug. It was malware from an attacker."}, {"t": "48,000 player accounts were hacked.", "best": false, "f": "48,000 received the email. We don't know how many ran it. Overstating causes panic."}, {"t": "A phishing email went out, but everything is fine now.", "best": false, "f": "Players who ran the file are still at risk. \"Fine\" isn't true yet."}]}, "reveal": {"company": "2K Games", "year": "2022", "summary": "In September 2022, 2K said an unauthorized party got login details for a vendor's help desk platform and used it to email players a link. The download was malware disguised as a game launcher. Security researchers identified it as RedLine, a stealer that grabs saved passwords and browser data. 2K told players not to open the emails, to reset passwords, and to turn on MFA.", "lesson": "A trusted sender can still be compromised. Confirm surprises through a separate official channel.", "ttps": [["T1078", "Valid Accounts"], ["T1566.002", "Spearphishing Link"], ["T1204.002", "Malicious File"], ["T1555", "Credentials from Password Stores"]]}, "timeline": [{"t": "Steals the login for a vendor support account", "s": [0, 3]}, {"t": "Builds a fake launcher that steals passwords", "s": [1]}, {"t": "Emails 48,000 nothing."}, {"t": "It came from a U.S. phone number", "r": false, "w": "Phone numbers are easy to spoof or buy. The country doesn't make it safe or unsafe."}], "q": "What do you do?", "opts": [{"t": ["Tap the link and log in quickly so your account isn't locked.", "Sign in through the link right away to keep your account open."], "v": "bad", "pts": 0, "f": "The link leads to a fake login page that captures your password and code."}, {"t": ["Don't tap it. Report the text through the official IT help desk.", "Leave the link alone and report the text to IT through the usual help desk."], "v": "best", "pts": 3, "f": "You stay safe, and IT can warn everyone else who got the same text."}, {"t": ["Delete the text and get on with your day.", "Ignore it and delete the message."], "v": "ok", "pts": 1, "f": "You're safe, but security never learns that others got the same text. Reporting protects your coworkers."}, {"t": ["Reply and ask which activity was flagged on your account.", "Text back asking what the unusual activity was."], "v": "bad", "pts": 0, "f": "Replying tells the attacker your number is active, and they'll happily keep the conversation going."}], "evidence": [{"b": "Long-press the link", "t": "Full link address", "f": "https://graveyard-games-it.help/verify. The domain was registered three days ago.", "tool": "Phone"}, {"b": "Look up the sender's number", "t": "Sender number", "f": "+1 (415) 555-0199 is an internet phone number. It isn't in the company directory.", "tool": "Directory"}, {"b": "Check the IT status page", "t": "IT status page", "f": "No lockouts or security alerts posted today.", "tool": "IT status"}, {"b": "Check your account security page", "t": "Your account", "f": "No unusual activity and no pending lockout on your account.", "tool": "Directory"}]}, "s2": {"source": "Identity provider + web proxy · combined log", "intro": "A coworker named Jordan did tap the link. Find the entries that show what happened next.", "notes": ["The real IT site is graveyardgames.com/it-help.", "m.santos works remotely from Toronto, Canada.", "The company VPN exits through Frankfurt, Germany. VPN sign-ins come from known devices."], "cols": ["Time", "User", "Location", "Device", "Event", "Result"], "rows": [{"c": ["8:40 AM", "svc-backup", "Data center", "Backup server", "Scheduled backup", "Success"], "s": false, "w": "Routine automated job."}, {"c": ["8:55 AM", "j.okafor", "San Antonio, TX", "Windows laptop (known)", "Sign in", "Success"], "s": false, "w": "Jordan starting the workday normally."}, {"c": ["9:02 AM", "m.santos", "Toronto, Canada", "MacBook (known)", "Sign in", "Success"], "s": false, "w": "The notes say m.santos works from Toronto."}, {"c": ["9:05 AM", "r.patel", "San Antonio, TX", "Windows laptop (known)", "Visited graveyardgames.com/it-help", "Allowed"], "s": false, "w": "That's the real IT site."}, {"c": ["9:12 AM", "j.okafor", "San Antonio, TX", "iPhone (known)", "Visited graveyard-games-it.help", "Allowed"], "s": true, "w": "The lookalike domain from the text."}, {"c": ["9:13 AM", "j.okafor", "San Antonio, TX", "iPhone (known)", "Approved MFA push", "Success"], "s": true, "w": "Jordan approved a login prompt while on the fake page. The attacker was logging in at the same moment."}, {"c": ["9:14 AM", "j.okafor", "Frankfurt, Germany (hosting provider)", "Windows PC (new)", "Sign in", "Success"], "s": true, "w": "Same city as the VPN, but a hosting provider and a new device. Not the company VPN."}, {"c": ["9:15 AM", "j.okafor", "Frankfurt, Germany (hosting provider)", "Windows PC (new)", "Created rule: forward all mail to an outside address", "Success"], "s": true, "w": "A forwarding rule lets the attacker keep reading Jordan's email even after a password reset."}, {"c": ["9:16 AM", "j.okafor", "Frankfurt, Germany (hosting provider)", "Windows PC (new)", "Opened \"2027 Release Calendar.xlsx\"", "Success"], "s": true, "w": "Going straight for unannounced game plans."}, {"c": ["9:20 AM", "r.patel", "San Antonio, TX", "MacBook (known)", "Sign in", "Failed: wrong password"], "s": false, "w": "One typo..."}, {"c": ["9:21 AM", "r.patel", "San Antonio, TX", "MacBook (known)", "Sign in", "Success"], "s": false, "w": "...then a normal login."}, {"c": ["9:25 AM", "d.nguyen", "Frankfurt (company VPN)", "Windows laptop (known)", "Sign in", "Success"], "s": false, "w": "Company VPN with a known device. Same city as the attacker, but a normal login."}, {"c": ["9:40 AM", "j.okafor", "San Antonio, TX", "Windows laptop (known)", "Opened Teams", "Success"], "s": false, "w": "The real Jordan, still at work and unaware."}], "profiles": {"j.okafor": {"role": "Producer", "usual": "San Antonio, TX", "devices": "Windows laptop, iPhone", "note": "No travel on file."}, "m.santos": {"role": "Narrative Designer", "usual": "Toronto, Canada", "devices": "MacBook", "note": "Full-time remote."}, "r.patel": {"role": "IT Support", "usual": "San Antonio, TX", "devices": "Windows laptop, MacBook", "note": "Uses the real IT site daily."}, "d.nguyen": {"role": "Live Ops", "usual": "San Antonio, TX (via company VPN)", "devices": "Windows laptop", "note": "Company VPN exits in Frankfurt."}, "svc-backup": {"role": "Service account · backups", "usual": "Data center", "devices": "Backup server", "note": "Scheduled job."}}, "lookups": {"San Antonio, TX": "Graveyard Games office network.", "Toronto, Canada": "Residential internet in Toronto.", "Frankfurt, Germany (hosting provider)": "Rented cloud server in Frankfurt. Not the company VPN.", "Frankfurt (company VPN)": "Graveyard Games VPN gateway in Frankfurt.", "Data center": "Company data center."}}, "s3": {"intro": "Jordan's password and login were captured through a fake page. Pick your 3 first moves.", "acts": [{"t": "End Jordan's sessions and reset the password", "g": "now", "w": "Kicks out the attacker and makes the stolen password useless.", "do": ["directory|j.okafor|revoke", "directory|j.okafor|reset"], "fx": {"cut": [["atk", "jacct"]], "say": "Jordan's sessions are revoked and the password is reset."}}, {"t": "Delete the mail forwarding rule", "g": "now", "w": "Otherwise the attacker keeps getting Jordan's email even after the reset.", "do": ["mail|Forward all mail to an outside address|delete"], "fx": {"guard": {"rule": "Deleted"}, "say": "The forwarding rule is deleted."}}, {"t": "Block the lookalike domain for the whole company", "g": "now", "w": "Anyone else who taps the link hits a wall.", "do": ["network|graveyard-games-it.help|block"], "fx": {"guard": {"site": "Blocked"}, "say": "The fake IT site is blocked company-wide."}}, {"t": "Warn all staff about the fake IT text", "g": "later", "w": "Important, and it comes right after you've cut off the active attacker.", "do": ["desk"]}, {"t": "Switch MFA to number matching so push approvals are harder to trick", "g": "later", "w": "A strong fix for the future, not a first move.", "do": ["directory|*|numbermatch"]}, {"t": "Remotely wipe Jordan's phone", "g": "bad", "w": "The phone wasn't infected; the password was typed into a fake site. Wiping destroys evidence.", "do": ["directory|j.okafor|wipe"]}, {"t": "Call out Jordan by name in the company chat", "g": "bad", "w": "Shame makes people hide mistakes. You want fast reporting.", "do": ["desk"]}, {"t": "Block all text messages on company phones", "g": "bad", "w": "Overkill that breaks real communication and doesn't remove the attacker.", "do": ["desk"]}], "feed": [{"t": "Reads Jordan's inbox", "by": [0], "path": ["atk", "jacct", "inbox"]}, {"t": "Forwarding rule sends \"Q3 budget\" to an outside inbox", "by": [1], "path": ["inbox", "rule", "outside"]}, {"t": "A second employee opens the fake IT link", "by": [2], "path": ["staff", "site"]}, {"t": "Downloads the \"Unannounced titles\" slide deck", "by": [0], "path": ["atk", "jacct", "files"]}, {"t": "Forwarding rule sends \"Publisher contract draft\"", "by": [1], "path": ["inbox", "rule", "outside"]}, {"t": "A third employee types a password into the fake site", "by": [2], "path": ["staff", "site", "atk"]}], "map": {"nodes": [{"id": "atk", "l": "Attacker", "k": "atk", "x": 48, "y": 62}, {"id": "jacct", "l": "j.okafor", "k": "account", "x": 160, "y": 62}, {"id": "inbox", "l": "Jordan's inbox", "k": "data", "x": 270, "y": 40}, {"id": "files", "l": "Release docs", "k": "data", "x": 355, "y": 105}, {"id": "rule", "l": "Forward rule", "k": "data", "x": 270, "y": 150}, {"id": "outside", "l": "Outside inbox", "k": "atk", "x": 355, "y": 215}, {"id": "site", "l": "Fake IT site", "k": "server", "x": 120, "y": 175}, {"id": "staff", "l": "Coworkers", "k": "people", "x": 40, "y": 215}, {"id": "soc", "l": "You (SOC)", "k": "soc", "x": 220, "y": 230}]}}, "s4": {"opts": [{"t": "Jordan entered a password on a fake IT site from a text. The attacker logged in, set up email forwarding, and opened the 2027 release calendar. Access is cut off and the rule is removed. We're checking what was forwarded.", "best": true, "f": "Accurate, complete, and clear about what's still being checked."}, {"t": "Jordan fell for a scam and should be disciplined.", "best": false, "f": "Blame doesn't help leadership decide anything, and it discourages reporting."}, {"t": "Someone in Germany hacked our company VPN.", "best": false, "f": "The VPN wasn't involved. The attacker used Jordan's stolen password."}, {"t": "A spam text went around. No impact.", "best": false, "f": "The attacker read internal files and forwarded email. That's impact."}]}, "reveal": {"company": "Activision", "year": "2022", "summary": "In December 2022, an Activision employee was tricked by a text message phishing attack. Reports said the attacker reached internal information, including content release plans. Activision said it addressed the incident quickly and that no sensitive employee data, game code, or player data was taken.", "lesson": "Real IT teams don't threaten you by text with a link. Report it so everyone else is warned.", "ttps": [["T1660", "Phishing (mobile)"], ["T1078", "Valid Accounts"], ["T1114.003", "Email Forwarding Rule"], ["T1213", "Data from Information Repositories"]]}, "timeline": [{"t": "Registers graveyard-games-it.help", "s": [1]}, {"t": "Texts employees a fake account-lockout warning", "s": [2]}, {"t": "Jordan enters a password and approves the MFA prompt", "s": [3]}, {"t": "Creates a rule forwarding Jordan's email outside", "s": [4]}, {"t": "Opens the 2027 release calendar", "s": [6]}], "console": {"tools": ["directory", "mail", "network", "desk", "docs"], "docs": ["acct", "phish"], "mfa": {"j.okafor": ["iPhone (push approvals) · enrolled 2024"]}, "globals": {"directory": [{"verb": "numbermatch", "label": "Require number matching on all MFA prompts"}]}, "mail": {"rules": [{"target": "Forward all mail to an outside address", "owner": "j.okafor", "note": "Created today 9:15 AM from Frankfurt"}, {"target": "Move newsletters to a folder", "owner": "r.patel", "note": "Created 2024"}], "messages": []}, "network": [{"target": "graveyard-games-it.help", "note": "Lookalike IT login page"}, {"target": "Frankfurt, Germany (hosting provider)", "note": "Rented server used to sign in as Jordan"}, {"target": "Frankfurt (company VPN)", "note": "Company VPN gateway"}], "nofx": {"mail|Move newsletters to a folder|delete": "You deleted a coworker's harmless newsletter rule.", "network|Frankfurt, Germany (hosting provider)|block": "That server is blocked, but the attacker still has Jordan's session and the forwarding rule keeps sending mail.", "network|Frankfurt (company VPN)|block": "You cut off everyone on the company VPN. The attacker isn't using it."}}}, {"id": "shield", "file": "CASE 1031", "title": "The Stolen Shield", "diff": "Hard", "teaser": "A friendly security teammate needs your code access token. Tonight.", "s1": {"role": "You are a developer on the anti-cheat team. A chat message pops up at 1:40 AM.", "msg": {"type": "chat", "name": "Riley (Security Team)", "tag": "External guest", "channel": "Direct message", "text": "Hi! Riley from security. We're rotating code repository keys tonight for the anti-cheat project. Paste your access token here so I can migrate you, or you'll lose access before the patch ships."}, "flags": [{"t": "Riley is labeled \"External guest\"", "r": true, "w": "The real security team works for the company. Guests are outsiders."}, {"t": "It asks you to paste a secret token into chat", "r": true, "w": "Tokens work like passwords. No legitimate process collects them in chat."}, {"t": "It warns you'll lose access before the patch", "r": true, "w": "A threat plus a deadline is pressure, not process."}, {"t": "Rotating keys is a real security practice", "r": false, "w": "True, and that's why the story is believable. It isn't the warning sign."}, {"t": "The message is friendly and casual", "r": false, "w": "Plenty of real coworkers write like this."}, {"t": "It mentions the anti-cheat project by name", "r": false, "w": "Project names leak easily. Not a red flag, not proof."}], "q": "What do you do?", "opts": [{"t": ["Paste it. Key rotation is normal and Riley knows the project.", "Share the token. Rotating keys is standard and the details check out."], "v": "bad", "pts": 0, "f": "An access token is as good as your password. Anyone holding it can copy your code."}, {"t": ["Don't respond. Report the message through the official security channel.", "Ignore Riley and report the message to security through the normal channel."], "v": "best", "pts": 3, "f": "The real security team is never an outside guest, and nobody legitimate asks for tokens in chat."}, {"t": ["Ask Riley to confirm your manager's name and the project code first.", "Test Riley by asking for your manager's name and the project code."], "v": "ok", "pts": 1, "f": "Good instinct, but org charts are easy to find online. Verification has to happen outside this chat."}, {"t": ["Create a brand-new token and share that instead of your main one.", "Make a fresh token just for Riley so your main one stays private."], "v": "bad", "pts": 0, "f": "A new token opens the same doors. You've just made one specifically for the attacker."}], "evidence": [{"b": "Open Riley's profile", "t": "Riley's profile", "f": "Riley M. · External guest · invited two days ago from a personal Gmail address. Not a member of the security channel.", "tool": "Chat admin"}, {"b": "Search the staff directory for Riley", "t": "Staff directory", "f": "No one named Riley works on the security team.", "tool": "Directory"}, {"b": "Check security team announcements", "t": "Security announcements", "f": "No key rotation scheduled. Policy: tokens are only rotated in the developer portal.", "tool": "Documentation"}, {"b": "Check the anti-cheat patch date", "t": "Release schedule", "f": "The anti-cheat patch ships next Thursday, not tonight.", "tool": "Release calendar"}]}, "s2": {"source": "Code repository · audit log", "intro": "Another developer, Kai, fell for it. Find the entries showing the attacker at work.", "notes": ["Kai often works past midnight.", "dev.priya works with the partner studio in Seoul, South Korea.", "The build server clones about 40 repositories every night.", "prod_keys.env holds passwords for live game servers."], "cols": ["Time", "User", "Location", "Device", "Event", "Result"], "rows": [{"c": ["12:30 AM", "ci-bot", "Build server", "Server", "Scheduled build", "Success"], "s": false, "w": "The automated build system."}, {"c": ["1:12 AM", "dev.sam", "San Antonio, TX", "Windows laptop (known)", "Merged pull request", "Success"], "s": false, "w": "Late-night work from a known person and device."}, {"c": ["1:40 AM", "dev.kai", "San Antonio, TX", "MacBook (known)", "Sign in", "Success"], "s": false, "w": "The notes say Kai often works late."}, {"c": ["1:52 AM", "dev.kai", "San Antonio, TX", "MacBook (known)", "Created access token \"migration\"", "Success"], "s": true, "w": "The subtle one: Kai made a new token right after \"Riley\" asked. This is where it started."}, {"c": ["2:10 AM", "dev.priya", "Seoul, South Korea", "MacBook (known)", "Cloned repo game-ui", "Success"], "s": false, "w": "The notes say Priya works with the Seoul studio. Known device, one repo."}, {"c": ["2:30 AM", "dev.ana", "Austin, TX", "MacBook (known)", "Sign in (2 failures, then success)", "Success"], "s": false, "w": "A couple of typos at 2:30 AM is very human."}, {"c": ["2:47 AM", "dev.kai", "Cloud server (rented)", "Script", "Token \"migration\" used", "Success"], "s": true, "w": "The new token used from a rented server, not Kai's laptop."}, {"c": ["2:49 AM", "dev.kai", "Cloud server (rented)", "Script", "Cloned repo anticheat-core", "Success"], "s": true, "w": "Going for anti-cheat code first. Cheat makers would pay for it."}, {"c": ["2:53 AM", "dev.kai", "Cloud server (rented)", "Script", "Listed all repositories", "Success"], "s": true, "w": "Mapping everything there is to take."}, {"c": ["2:58 AM", "dev.kai", "Cloud server (rented)", "Script", "Cloned 214 repositories in 9 minutes", "Success"], "s": true, "w": "Automated theft of almost everything."}, {"c": ["3:05 AM", "ci-bot", "Build server", "Server", "Cloned 40 repositories for nightly build", "Success"], "s": false, "w": "Looks like the theft, but the notes say this happens every night."}, {"c": ["3:20 AM", "dev.kai", "Cloud server (rented)", "Script", "Read file prod_keys.env", "Success"], "s": true, "w": "The attacker now has passwords for live game servers."}, {"c": ["9:01 AM", "dev.kai", "San Antonio, TX", "MacBook (known)", "Sign in", "Success"], "s": false, "w": "The real Kai arriving at work, unaware."}], "profiles": {"dev.kai": {"role": "Anti-cheat Engineer", "usual": "San Antonio, TX", "devices": "MacBook", "note": "Often works past midnight. Has access to all repositories."}, "dev.sam": {"role": "Gameplay Engineer", "usual": "San Antonio, TX", "devices": "Windows laptop", "note": "Normal late-night commits."}, "dev.priya": {"role": "UI Engineer (partner studio)", "usual": "Seoul, South Korea", "devices": "MacBook", "note":     const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(String(clock).trim());
    if (!m) return null;
    let h = parseInt(m[1], 10) % 12;
    if (m[3].toUpperCase() === "PM") h += 12;
    return h * 60 + parseInt(m[2], 10);
  }

  function normalize(c) {
    const cols = c.s2.cols;
    let last = null, offset = 0;
    return c.s2.rows.map((row, i) => {
      const rec = {};
      cols.forEach((name, k) => { rec[name] = row.c[k]; });
      const t = toMinutes(rec.Time || "");
      if (t !== null && last !== null && t + offset < last - 360) offset += 1440; // crossed midnight
      const ts = t === null ? null : t + offset;
      if (ts !== null) last = ts;
      rec._i = i; rec._ts = ts; rec._suspicious = row.s;
      rec._user = rec.User || rec.Account || "";
      rec._text = row.c.join(" ");
      return rec;
    });
  }

  const placeKey = loc => loc.split("(")[0].split(",")[0].trim().toLowerCase();
  const title = s => s.replace(/\b\w/g, ch => ch.toUpperCase());

  function run(c, ruleset) {
    const events = normalize(c);
    const alerts = [];
    const alert = (rule, ev, detail) => alerts.push({
      row: ev._i, rule: rule.id, title: rule.title, severity: rule.severity,
      technique: rule.technique, technique_name: rule.technique_name, detail,
      time: ev.Time || "", user: ev._user, true_positive: ev._suspicious
    });

    for (const rule of ruleset.rules) {
      if (rule.type === "keyword") {
        const rx = new RegExp(rule.pattern, "i");
        for (const ev of events) {
          const fields = rule.fields[0] === "*" ? [ev._text] : rule.fields.map(f => ev[f] || "");
          const hit = fields.find(f => rx.test(f));
          if (hit) alert(rule, ev, `matched "${rx.exec(hit)[0]}"`);
        }
      } else if (rule.type === "impossible_travel") {
        const lastSeen = {};
        for (const ev of events) {
          const loc = ev.Location;
          if (!loc || ev._ts === null || ruleset.travel_ignore_locations.some(x => loc.toLowerCase().includes(x))) continue;
          const prev = lastSeen[ev._user];
          if (prev && !(loc + prev.Location).toLowerCase().includes("company vpn")) {
            const gap = ev._ts - prev._ts;
            if (placeKey(loc) !== placeKey(prev.Location) && gap <= ruleset.travel_window_minutes)
              alert(rule, ev, `${title(placeKey(prev.Location))} to ${title(placeKey(loc))} in ${gap} min`);
          }
          lastSeen[ev._user] = ev;
        }
      } else if (rule.type === "lookalike_domain") {
        for (const ev of events) {
          const doms = (ev.Event || "").match(DOMAIN_RE) || [];
          for (const dom of doms) {
            const d = dom.toLowerCase();
            if (d.includes(ruleset.brand) && d !== ruleset.official_domain && !d.endsWith("." + ruleset.official_domain)) {
              alert(rule, ev, `${dom} is not ${ruleset.official_domain}`);
              break;
            }
          }
        }
      } else if (rule.type === "volume") {
        const gbRx = new RegExp(NUM + "\\s*GB", "i");
        const cntRx = new RegExp(NUM + "\\s+(" + rule.count_units + ")", "i");
        for (const ev of events) {
          const text = ev.Event || "";
          const gb = gbRx.exec(text), cnt = cntRx.exec(text);
          if (gb && parseInt(gb[1].replace(/,/g, ""), 10) >= rule.gb_threshold) alert(rule, ev, `${gb[0]} moved`);
          else if (cnt && parseInt(cnt[1].replace(/,/g, ""), 10) >= rule.count_threshold) alert(rule, ev, `${cnt[0]} in one action`);
        }
      }
    }
    alerts.sort((a, b) => a.row - b.row || SEVERITY_ORDER[a.severity] - SEVERITY_ORDER[b.severity]);
    return alerts;
  }

  function score(c, alerts) {
    const flagged = new Set(alerts.map(a => a.row));
    const truth = new Set(c.s2.rows.map((r, i) => r.s ? i : -1).filter(i => i >= 0));
    const tp = [...flagged].filter(i => truth.has(i)).length;
    return {
      flagged, truth, tp,
      fp: flagged.size - tp,
      missed: [...truth].filter(i => !flagged.has(i))
    };
  }

  window.Detect = { run, score };
})();

</script>

const RULES = window.RULES;
const BUILD = "3.3";

const app=document.getElementById("app");
const stepsEl=document.getElementById("steps");
let S=null, lastId=null, MODE="solo", TEAM=null;

const ROLES=[

const HUDDLE=[
  "Team huddle: investigate first. Split up the evidence buttons, share what you find, then {n} makes the final calls.",

];

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function trained(){return parseInt(store("hs-analysts")||"0",10)||0}
function board(){try{return JSON.parse(store("hs-board")||"[]")||[]}catch(e){return []}}
function shuf(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function word(t,key){ if(!Array.isArray(t))return t; if(!(key in S.words))S.words[key]=Math.floor(Math.random()*t.length); return t[S.words[key]]; }

}

  ${b.map((r,i)=>`<tr class="${r.at===highlight?"you":""}"><td class="num" style="text-align:left">${i+1}</td><td>${esc(r.t)}</td><td>${esc(r.c)}</td><td class="num">${r.pts} / ${r.max}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

}
function toTop(){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

function home(){

  S=null; setSteps(-1);
  app.innerHTML=`
  <section class="hero">

      Your job, in five stations:<br>

      <b>4</b> · Rebuild the timeline<br>

      Every case is based on a real attack on a game company.

  </section>
  <section class="stack">

      <button class="case" data-a="pick" data-id="${c.id}">
        <span class="file">${c.file}</span>
        <h3>${c.title}</h3>
        <p>${c.teaser}</p>
        <span class="pill d-${c.diff}">${c.diff}</span>

    <button class="linkish" data-a="resetcount">Reset count and leaderboard</button>
  </footer>`;
}

function start(id){
  closeBrief();
  lastId=id;
  const c=CASES.find(x=>x.id===id);
  S={c, words:{},
     flags:new Set(), flagsDone:false, oF:shuf(c.s1.flags.length),
     s1:null, o1:shuf(c.s1.opts.length),
     flagged:new Set(), s2done:false,
     ev:[], evNew:null, card:null, q:"",
     live:{started:false, done:false, used:[], wasted:0, doneKeys:[], log:[], next:0, tm:null, anim:0}, briefed:{}, o3:shuf(c.s3.acts.length),
     con:{tool:c.console.tools[0], user:null},
     tl:{pool:shuf(c.timeline.length), placed:[], stages:{}, done:false},
