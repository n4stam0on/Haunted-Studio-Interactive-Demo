<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Haunted Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Pirata+One&display=swap">
<style>
/* Layout: one security-console column. Header holds the studio badge and a 4-step station tracker; each station is one working panel. Deliberately single (dark) theme: a night-shift console. */
:root{
  --night:#17121f; --panel:#211a2c; --panel-2:#2b2238; --line:#3e3252;
  --bone:#efe6d8; --dim:#b2a7c3; --pumpkin:#f0883e; --pumpkin-ink:#1f1308;
  --ecto:#6fd3b5; --amber:#e9b949; --blood:#f0695e;
  --pumpkin-wash:rgba(240,136,62,.14); --ecto-wash:rgba(111,211,181,.13); --blood-wash:rgba(240,105,94,.14); --amber-wash:rgba(233,185,73,.14);
  --f-display:"Pirata One", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--bone)}
body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1060px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;color:var(--pumpkin);letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.steps li.done{color:var(--ecto);border-color:color-mix(in srgb,var(--ecto) 45%,transparent)}
.steps li.now{color:var(--pumpkin-ink);background:var(--pumpkin);border-color:var(--pumpkin);font-weight:600}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,76px);line-height:.95;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,42px);line-height:1.05}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:66ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin)}
.muted{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack-lg{display:flex;flex-direction:column;gap:24px;min-width:0}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:17px;background:var(--pumpkin);color:var(--pumpkin-ink);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--dim)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;color:var(--dim)}
.brief b{color:var(--bone);font-weight:600}
.brief .alert{color:var(--blood)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s ease,background .15s ease}
.case:hover{border-color:var(--pumpkin);background:var(--panel-2)}
.case .file{font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.case h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05}
.case p{font-size:15px;color:var(--dim)}
.pill{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.d-Easy{color:var(--ecto)} .d-Medium{color:var(--amber)} .d-Hard{color:var(--blood)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--bone)}

/* station panel */
.station-head{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}

/* messages */
.msg{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.msg-meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.line b{font-family:var(--f-mono);font-size:13px;color:var(--pumpkin);padding-top:2px}
.ehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ehead dt{color:var(--dim);font-family:var(--f-mono);font-size:12.5px;padding-top:2px}
.ehead dd{margin:0;overflow-wrap:anywhere}
.attach{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start}
.bubble{background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:34ch;overflow-wrap:anywhere}
.bubble u{color:var(--amber)}
.chatname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--amber-wash);color:var(--amber)}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;transition:border-color .15s ease}
.choice:hover:not([disabled]){border-color:var(--pumpkin)}
.choice[disabled]{cursor:default}
.key{font-family:var(--f-mono);font-weight:600;font-size:13px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.choice.v-best{border-color:var(--ecto);background:var(--ecto-wash)}
.choice.v-bad.picked{border-color:var(--blood);background:var(--blood-wash)}
.choice.v-ok.picked{border-color:var(--amber);background:var(--amber-wash)}
.choice.dimmed{opacity:.55}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.best{background:var(--ecto-wash)} .fb.ok{background:var(--amber-wash)} .fb.bad{background:var(--blood-wash)}
.verdict{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.best .verdict{color:var(--ecto)} .ok .verdict{color:var(--amber)} .bad .verdict{color:var(--blood)}

/* logs */
.logwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--night)}
table.logs{border-collapse:collapse;width:100%;min-width:760px;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.logs th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.logs td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.logs tr:last-child td{border-bottom:0}
.row{cursor:pointer;transition:background .12s ease}
.row:hover{background:var(--panel)}
.row.sel{background:var(--pumpkin-wash)}
.row.sel td:first-child .box{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--pumpkin-ink)}
.box{width:20px;height:20px;border:1.5px solid var(--dim);border-radius:5px;display:grid;place-items:center;font-size:13px;line-height:1}
.graded .row{cursor:default}
.row.hit{background:var(--ecto-wash)} .row.miss{background:var(--amber-wash)} .row.false{background:var(--blood-wash)}
.why td{font-family:var(--f-body);font-size:14.5px;color:var(--bone);padding-top:0;padding-bottom:12px}
.why .verdict{margin-right:8px}
.why.hit .verdict{color:var(--ecto)} .why.miss .verdict{color:var(--amber)} .why.false .verdict{color:var(--blood)}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:13.5px}
.tally span b{font-weight:600}

/* actions */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease}
.act:hover:not([disabled]){border-color:var(--pumpkin)}
.act.sel{border-color:var(--pumpkin);background:var(--pumpkin-wash)}
.act[disabled]{cursor:default}
.act.good.sel{border-color:var(--ecto);background:var(--ecto-wash)}
.act.badpick{border-color:var(--blood);background:var(--blood-wash)}
.act.missed{border-style:dashed;border-color:var(--ecto)}
.act .why2{font-size:14.5px;color:var(--dim)}
.picked-n{font-family:var(--f-mono);font-size:13px;color:var(--dim)}

/* result */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chain li{border-radius:10px;padding:10px 10px 12px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.chain .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.chain .k{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.chain .p{font-size:12.5px;color:var(--dim);line-height:1.3}
.chain li.reached{background:var(--blood-wash);border-color:color-mix(in srgb,var(--blood) 50%,transparent)}
.chain li.reached .n{color:var(--blood)}
.chain li.stop{background:var(--ecto-wash);border:2px solid var(--ecto)}
.chain li.stop .n{color:var(--ecto)}
.score{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:var(--panel-2);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:140px}
.stat b{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--dim)}
.reveal{background:var(--bone);color:var(--pumpkin-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.reveal .eyebrow{color:#9a4a12}
.reveal h2{color:var(--pumpkin-ink)}
.reveal p{color:#2b2233}
.reveal .lesson{font-weight:700}
.ttps{display:flex;flex-wrap:wrap;gap:8px}
.ttp{font-family:var(--f-mono);font-size:12.5px;background:#e3d7c4;color:#2b2233;border-radius:6px;padding:4px 8px}
.ttp b{font-weight:600}
.fineprint{font-size:13px;color:#5b5165}

/* team mode */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--bone)}
.teamform{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.field input{font:inherit;font-size:16px;color:var(--bone);background:var(--night);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.field input:focus{outline:2px solid var(--amber);outline-offset:1px}
.formnote{grid-column:1/-1;font-size:14px;color:var(--dim)}
.formnote.err{color:var(--blood)}
.onpoint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--pumpkin-wash);border-radius:12px;padding:12px 16px}
.onpoint .who{font-size:19px;font-weight:700}
.onpoint .role{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pumpkin)}
.onpoint p{flex-basis:100%;font-size:15px;color:var(--bone)}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.roster span{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:14.5px}
.roster i{font-style:normal;color:var(--dim);font-size:13px}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{text-align:left;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.board td{padding:9px 10px;border-bottom:1px solid var(--line)}
.board tr.you td{color:var(--pumpkin);font-weight:700}
.board td.num{font-family:var(--f-mono);text-align:right}
@media (max-width:820px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Graveyard Games</b><span>Security Operations · Night Shift</span></div>
    <ol class="steps" id="steps" aria-label="Progress"></ol>
  </header>
  <main id="app" class="stack-lg" aria-live="polite"></main>
</div>

<script>
const STAGES=[
  {k:"Reconnaissance",p:"Scouting the target"},
  {k:"Weaponization",p:"Building the trap"},
  {k:"Delivery",p:"Sending the trap"},
  {k:"Exploitation",p:"Springing the trap"},
  {k:"Installation",p:"Moving in"},
  {k:"Command & Control",p:"Taking the controls"},
  {k:"Actions on Objectives",p:"Stealing the treasure"}
];

const CASES=[
{
  id:"caller", file:"CASE 0451", title:"The Midnight Caller", diff:"Easy",
  teaser:"A developer calls the help desk at midnight, locked out and desperate.",
  s1:{
    role:"You are working the help desk phone tonight.",
    msg:{type:"call", meta:"Help desk line · 11:48 PM", lines:[
      ["Caller","Hey, it's Marcus Vane from the engine team. I'm at the airport and I lost my phone, so I can't get my login code."],
      ["Caller","The launch build has to go out tonight or my lead is going to lose it. Can you reset my MFA and send the new code to this number instead?"]
    ]},
    q:"What do you do?",
    opts:[
      {t:"Reset his MFA right away. He sounds stressed and the launch is a big deal.",v:"bad",pts:0,f:"Urgency is an attacker's favorite tool. A rushed reset hands your account system to whoever is on the phone."},
      {t:"Ask for his employee ID and birthday, then reset it.",v:"ok",pts:1,f:"Better than nothing, but that kind of information turns up in data leaks and on social media. An attacker may already have it."},
      {t:"Hang up and call Marcus back on the number in the company directory, or confirm with his manager.",v:"best",pts:3,f:"Verifying through a channel you already trust is the move. If the caller is a fake, the real Marcus picks up and is confused."},
      {t:"Send the reset link to his work email instead of the new number.",v:"ok",pts:1,f:"Safer than texting a new number. But if his account is already compromised, the attacker reads that email too."}
    ]
  },
  s2:{
    source:"Identity provider · sign-in log",
    intro:"Someone else took the call last night and reset the MFA. Find the entries that show the attacker moving in.",
    cols:["Time","User","Location","Device","Event","Result"],
    rows:[
      {c:["11:02 PM","m.vane","San Antonio, TX","Windows laptop (known)","Sign in","Success"],s:false,w:"Marcus signing in from his usual laptop, at home, before the call."},
      {c:["11:30 PM","svc-backup","Data center","Server","Scheduled backup","Success"],s:false,w:"An automated service account doing its nightly job."},
      {c:["11:40 PM","a.rios","Austin, TX","MacBook (known)","Sign in","Success"],s:false,w:"A coworker on a known device in an expected place."},
      {c:["11:52 PM","m.vane","San Antonio, TX","Help desk portal","New MFA phone enrolled (+40 number)","Success"],s:true,w:"A new login phone from another country, added minutes after a midnight phone request."},
      {c:["11:53 PM","m.vane","Bucharest, Romania","Unknown Linux device","Sign in","Success"],s:true,w:"Impossible travel: San Antonio at 11:02, Romania 51 minutes later."},
      {c:["12:07 AM","m.vane","Bucharest, Romania","Unknown Linux device","Download build_final.zip (38 GB)","Success"],s:true,w:"A huge download of the unreleased game from the new device. This is the leak."},
      {c:["12:10 AM","k.tran","San Antonio, TX","Windows laptop (known)","Sign in","Failed: wrong password"],s:false,w:"One failed login is usually a typo. A burst of them would be worth a look."}
    ]
  },
  s3:{
    intro:"The attacker is inside Marcus's account. Pick the 3 moves you make first.",
    acts:[
      {t:"End all of Marcus's active sessions",g:true,w:"Kicks the attacker out of every place they are logged in right now."},
      {t:"Remove the new MFA phone and reset his password",g:true,w:"Takes away the keys the attacker tricked the help desk into giving them."},
      {t:"Block the build server download from the new device",g:true,w:"Stops any more of the game from walking out the door."},
      {t:"Email every employee that the game leaked",g:false,w:"Communication matters, but first you contain the attack. Then you share facts through a planned message."},
      {t:"Delete the logs so the leak details don't spread",g:false,w:"Logs are your evidence. Deleting them helps the attacker, not you."},
      {t:"Wait until morning to tell the security team",g:false,w:"Every hour you wait, the attacker keeps working. Escalate now."}
    ]
  },
  reveal:{company:"Electronic Arts",year:"2021",
    summary:"In June 2021, attackers broke into EA. News reports said they bought a stolen login cookie online, used it to get into the company's Slack, then messaged IT support pretending to be an employee who had lost their phone. Support gave them a login token, and they took source code for FIFA 21 and the Frostbite game engine.",
    lesson:"Verify identity through a channel you already trust, not the one the request came from.",
    ttps:[["T1539","Steal Web Session Cookie"],["T1656","Impersonation"],["T1078","Valid Accounts"]]}
},
{
  id:"launcher", file:"CASE 0666", title:"The Cursed Launcher", diff:"Medium",
  teaser:"Players get an email from official support with a brand-new game launcher.",
  s1:{
    role:"You are a Graveyard Games player checking your inbox.",
    msg:{type:"email", from:"Graveyard Games Support &lt;support@graveyardgames.com&gt;", to:"you", subject:"Action required: install the new Graveyard Launcher", attach:null,
      body:"Hi Player, our old launcher will stop working this weekend. To keep your account and in-game items safe, download and install the new Graveyard Launcher from the link below before Friday."},
    q:"The sender address is real. What do you do?",
    opts:[
      {t:"Download and install it. It came from the real support address.",v:"bad",pts:0,f:"A real address only proves the email came from that system. If the system itself is compromised, the attacker sends from it too."},
      {t:"Check the official website and social accounts to see if a new launcher was announced.",v:"best",pts:3,f:"Confirming through a separate official channel catches a compromised sender. No announcement anywhere else is a big red flag."},
      {t:"Reply to the email and ask if it's real.",v:"ok",pts:1,f:"Asking is a good instinct, but your reply goes back to the same compromised system, so the attacker may answer you."},
      {t:"Forward it to a friend to see if they got it too.",v:"bad",pts:0,f:"You just spread the trap to someone else, and their copy looks exactly as real as yours."}
    ]
  },
  s2:{
    source:"Support platform · admin activity log",
    intro:"Thousands of players got that email. Find the entries showing how the attacker used your support system.",
    cols:["Time","Account","Location","Device","Event","Result"],
    rows:[
      {c:["2:14 PM","agent.dana","San Antonio, TX","Office PC (known)","Sign in","Success"],s:false,w:"A support agent starting her shift as usual."},
      {c:["2:50 PM","vendor.oscar","Manila, Philippines","Vendor office PC (known)","Sign in","Success"],s:false,w:"An outsourced support agent signing in from his normal office."},
      {c:["3:02 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Sign in","Success"],s:true,w:"Same account, a different continent 12 minutes later, on an unknown device. Someone else has his password."},

const app=document.getElementById("app");
const stepsEl=document.getElementById("steps");
let S=null, lastId=null, MODE="solo", TEAM=null;

const ROLES=[
  {r:"Help Desk Lead"},{r:"Threat Hunter"},{r:"Incident Commander"},{r:"Communications Lead"}
];
const HUDDLE=[
  "Team huddle, 30 seconds: what is being asked for, and why the rush? Everyone weighs in, then {n} makes the call.",
  "Split the log: one person checks times and places, another checks devices and events. {n} flags the rows and submits.",
  "Huddle: what stops the attacker right now, what protects evidence, and what can wait? {n} locks in the 3 moves.",
  "{n}, you're on comms: read the real story out loud, then ask the team which station was hardest and why."
];

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function trained(){return parseInt(store("hs-analysts")||"0",10)||0}
function board(){try{return JSON.parse(store("hs-board")||"[]")||[]}catch(e){return []}}

function teamForm(){
  const t=TEAM||{name:"",players:[]};
  return `<div class="teamform">
    <div class="field" style="grid-column:1/-1"><label for="tname">Team name</label><input id="tname" maxlength="28" placeholder="The Night Watch" value="${esc(t.name)}"></div>
    ${[0,1,2,3].map(i=>`<div class="field"><label for="p${i}">Analyst ${i+1}${i>1?" (optional)":""}</label><input id="p${i}" maxlength="20" placeholder="First name" value="${esc(t.players[i]||"")}"></div>`).join("")}
    <p class="formnote" id="tnote">Roles: Help Desk Lead, Threat Hunter, Incident Commander, Communications Lead. Each person leads a station; with fewer than 4, roles double up.</p>
  </div>`;
}
function readTeam(){
  const players=[0,1,2,3].map(i=>(document.getElementById("p"+i)||{}).value||"").map(s=>s.trim()).filter(Boolean);
  const note=document.getElementById("tnote");
  if(players.length<2){ if(note){note.textContent="Add at least 2 analysts to play as a team.";note.classList.add("err");} document.getElementById("p"+players.length)?.focus(); return null; }
  const name=((document.getElementById("tname")||{}).value||"").trim()||"Team "+players[0];
  return {name,players};
}
function onPoint(i){
  if(MODE!=="team"||!TEAM)return "";
  const n=esc(TEAM.players[i%TEAM.players.length]);
  return `<div class="onpoint"><span class="role">On point · ${ROLES[i].r}</span><span class="who">${n}</span><p>${HUDDLE[i].replace("{n}",n)}</p></div>`;
}
function boardHTML(highlight){
  const b=board().slice().sort((x,y)=>y.pts/y.max-x.pts/x.max||x.at-y.at).slice(0,5);
  if(!b.length)return "";
  return `<section class="stack"><h3>Tonight's team leaderboard</h3><div style="overflow-x:auto"><table class="board"><thead><tr><th>#</th><th>Team</th><th>Case</th><th style="text-align:right">Score</th></tr></thead><tbody>
  ${b.map((r,i)=>`<tr class="${r.at===highlight?"you":""}"><td class="num" style="text-align:left">${i+1}</td><td>${esc(r.t)}</td><td>${esc(r.c)}</td><td class="num">${r.pts} / ${r.max}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

function setSteps(i){
  const names=["1 · The Call","2 · Log Hunt","3 · Break the Chain","Reveal"];
  stepsEl.innerHTML=names.map((n,j)=>`<li class="${j<i?"done":j===i?"now":""}">${n}</li>`).join("");
  stepsEl.hidden = i<0;
}
function toTop(){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

function home(){
  S=null; setSteps(-1);
  app.innerHTML=`
  <section class="hero">
    <div class="stack">
      <span class="eyebrow">Interactive incident response</span>
      <h1>The Haunted Studio</h1>
      <p class="muted" style="font-size:19px">Graveyard Games launches its biggest game in three days. Tonight, something got into the machine. You're the newest security analyst. Find out how the ghost got in, and stop it.</p>
      <div class="seg" role="group" aria-label="Play mode"><button data-a="mode" data-m="solo" aria-pressed="${MODE==="solo"}">Solo analyst</button><button data-a="mode" data-m="team" aria-pressed="${MODE==="team"}">Analyst team (2–4)</button></div>
      ${MODE==="team"?teamForm():""}
      <div class="btn-row"><button class="btn" data-a="draw">Draw a case file</button><span class="muted" style="font-size:15px">About 10–15 minutes · no experience needed</span></div>
    </div>
    <div class="brief" aria-label="Shift briefing">
      <b>SHIFT BRIEFING · OCT 29</b><br>
      <span class="alert">▲ Unreleased build reported leaked</span><br>
      <span class="alert">▲ Player accounts losing rare items</span><br>
      Your job, in three stations:<br>
      <b>1</b> · Handle the first contact<br>
      <b>2</b> · Hunt through the logs<br>
      <b>3</b> · Break the attack chain<br>
      Every case is based on a real attack on a game company.
    </div>
  </section>
  <section class="stack">
    <h3>Or pick a case file</h3>
    <div class="cases">${CASES.map(c=>`
      <button class="case" data-a="pick" data-id="${c.id}">
        <span class="file">${c.file}</span>
        <h3>${c.title}</h3>
        <p>${c.teaser}</p>
        <span class="pill d-${c.diff}">${c.diff}</span>
      </button>`).join("")}
    </div>
  </section>
  ${boardHTML()}
  <footer class="foot">
    <span>Analysts trained at this table: <span class="count" id="cnt">${trained()}</span></span>
    <button class="linkish" data-a="resetcount">Reset count and leaderboard</button>
  </footer>`;
}

function start(id){
  lastId=id;
  S={c:CASES.find(x=>x.id===id), s1:null, flagged:new Set(), s2done:false, picked:new Set(), s3done:false};
  station1(); toTop();
}

function msgHTML(m){
  if(m.type==="call") return `<div class="msg"><span class="msg-meta">☎ ${m.meta}</span>${m.lines.map(l=>`<div class="line"><b>${l[0]}</b><span>${l[1]}</span></div>`).join("")}</div>`;
  if(m.type==="email") return `<div class="msg"><span class="msg-meta">✉ Inbox</span><dl class="ehead"><dt>From</dt><dd>${m.from}</dd><dt>To</dt><dd>${m.to}</dd><dt>Subject</dt><dd><b>${m.subject}</b></dd></dl><p>${m.body}</p>${m.attach?`<span class="attach">📎 ${m.attach}</span>`:`<span class="attach">⬇ Download Graveyard Launcher</span>`}</div>`;
  if(m.type==="sms") return `<div class="msg"><span class="msg-meta">Text message · ${m.from} · ${m.time}</span><div class="bubble">${m.text}</div></div>`;
  return `<div class="msg"><span class="msg-meta">${m.channel}</span><div class="chatname"><span class="avatar">R</span><b>${m.name}</b><span class="tag">${m.tag}</span></div><p>${m.text}</p></div>`;
}

function station1(){
  setSteps(0);
  const c=S.c, s=c.s1, ans=S.s1;
  const vLabel={best:"Best move",ok:"Partly safe",bad:"The ghost gets in"};
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · ${c.title} · Station 1</span><h2>The first contact</h2><p class="muted">${s.role}</p></div>
  ${onPoint(0)}
  <div class="two">
    ${msgHTML(s.msg)}
    <div class="stack">
      <h3>${s.q}</h3>
      <div class="choices">${s.opts.map((o,i)=>{
        let cls="choice";
        if(ans!==null){cls+=" v-"+o.v; if(i===ans)cls+=" picked"; else if(o.v!=="best")cls+=" dimmed";}
        return `<button class="${cls}" data-a="s1" data-i="${i}" ${ans!==null?"disabled":""}><span class="key">${"ABCD"[i]}</span><span>${o.t}</span></button>`}).join("")}
      </div>
      ${ans!==null?(()=>{const o=s.opts[ans];const best=s.opts.find(x=>x.v==="best");return `
        <div class="fb ${o.v}"><span class="verdict">${vLabel[o.v]} · +${o.pts}</span><p>${o.f}</p></div>
        ${o.v!=="best"?`<div class="fb best"><span class="verdict">Best move</span><p>${best.f}</p></div>`:""}
        <div class="btn-row"><button class="btn" data-a="to2">Go to Station 2: Log Hunt</button></div>`})():""}
    </div>
  </div>`;
}

function station2(){
  setSteps(1);
  const c=S.c, s=c.s2, done=S.s2done;
  const total=s.rows.filter(r=>r.s).length;
  let intro=s.intro;
  if(S.s1!==null && c.s1.opts[S.s1].v==="best") intro="You handled it well. But not everyone does. "+intro;
  let tally="";
  if(done){
    const g=grade2();
    tally=`<div class="tally"><span style="color:var(--ecto)">Caught <b>${g.hit}</b> of ${total}</span><span style="color:var(--amber)">Missed <b>${g.miss}</b></span><span style="color:var(--blood)">False alarms <b>${g.fa}</b></span></div>`;
  }
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Station 2</span><h2>Log Hunt</h2><p class="muted">${intro} Tap every suspicious row, then submit. <b style="color:var(--bone)">Hint: ${total} rows are suspicious.</b></p></div>
  ${onPoint(1)}
  <div class="panel">
    <span class="msg-meta">${s.source}</span>
    <div class="logwrap"><table class="logs ${done?"graded":""}"><thead><tr><th><span class="sr" aria-hidden="true">⚑</span></th>${s.cols.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${s.rows.map((r,i)=>{
      const sel=S.flagged.has(i);
      let st=""; if(done){ if(r.s&&sel)st="hit"; else if(r.s)st="miss"; else if(sel)st="false"; }
      const why = done && st ? `<tr class="why ${st}"><td></td><td colspan="${s.cols.length}"><span class="verdict">${st==="hit"?"Caught":st==="miss"?"Missed":"False alarm"}</span>${r.w}</td></tr>`:"";
      return `<tr class="row ${sel&&!done?"sel":""} ${st}" data-a="flag" data-i="${i}" tabindex="${done?-1:0}" role="checkbox" aria-checked="${sel}"><td><span class="box">${sel?"✓":""}</span></td>${r.c.map(x=>`<td>${x}</td>`).join("")}</tr>${why}`;
    }).join("")}
    </tbody></table></div>
    ${done?tally+`<div class="btn-row"><button class="btn" data-a="to3">Go to Station 3: Break the Chain</button></div>`
      :`<div class="btn-row"><button class="btn" data-a="sub2" ${S.flagged.size?"":"disabled"}>Submit findings (${S.flagged.size} flagged)</button></div>`}
  </div>`;
}
function grade2(){
  const rows=S.c.s2.rows; let hit=0,miss=0,fa=0;
  rows.forEach((r,i)=>{const f=S.flagged.has(i); if(r.s&&f)hit++; else if(r.s)miss++; else if(f)fa++;});
  return {hit,miss,fa,pts:Math.max(0,hit-fa),all:miss===0&&fa<=1};
}

function station3(){
  setSteps(2);
  const c=S.c, s=c.s3, done=S.s3done;
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Station 3</span><h2>Break the Chain</h2><p class="muted">${s.intro}</p></div>
  ${onPoint(2)}
  <div class="panel">
    <div class="actions">${s.acts.map((a,i)=>{
      const sel=S.picked.has(i); let cls="act";
      if(done){ if(sel&&a.g)cls+=" good sel"; else if(sel)cls+=" badpick"; else if(a.g)cls+=" missed"; }
      else if(sel)cls+=" sel";
      const label = done ? (sel&&a.g?`<span class="verdict" style="color:var(--ecto)">Good call</span>`: sel?`<span class="verdict" style="color:var(--blood)">Risky</span>`: a.g?`<span class="verdict" style="color:var(--ecto)">You missed this one</span>`:"") : "";
      return `<button class="${cls}" data-a="pick3" data-i="${i}" ${done?"disabled":""} aria-pressed="${sel}">${label}<b>${a.t}</b>${done&&(sel||a.g)?`<span class="why2">${a.w}</span>`:""}</button>`}).join("")}
    </div>
    ${done?`<div class="btn-row"><button class="btn" data-a="toR">Reveal the real case</button></div>`
      :`<div class="btn-row"><button class="btn" data-a="sub3" ${S.picked.size===3?"":"disabled"}>Lock in my 3 moves</button><span class="picked-n">${S.picked.size} of 3 chosen</span></div>`}
  </div>`;
}

function result(){
  setSteps(3);
  const c=S.c, o1=c.s1.opts[S.s1], g2=grade2();
  const good3=[...S.picked].filter(i=>c.s3.acts[i].g).length;
  let stop;
  if(o1.v==="best") stop=2; else if(g2.all) stop=4; else if(good3===3) stop=5; else stop=7;
  const pts=o1.pts+g2.pts+good3, max=3+c.s2.rows.filter(r=>r.s).length+3;
  const tiers={2:["Stopped at the door","Full-size candy"],4:["Caught it moving in","Two fun-size pieces"],5:["Took back the controls","One fun-size piece"],7:["The ghost got away","Consolation candy (we all start somewhere)"]};
  const t=tiers[stop];
  const team = MODE==="team" && TEAM;
  const n=trained()+(team?TEAM.players.length:1); store("hs-analysts",String(n));
  let at=null;
  if(team){ at=Date.now(); const b=board(); b.push({t:TEAM.name,c:c.title,pts,max,at}); store("hs-board",JSON.stringify(b.slice(-60))); }
  const roster = team ? `<div class="roster">${[0,1,2,3].map(i=>`<span>${esc(TEAM.players[i%TEAM.players.length])} <i>· ${ROLES[i].r}</i></span>`).join("")}</div>` : "";
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Debrief${team?" · "+esc(TEAM.name):""}</span><h2>${t[0]}</h2><p class="muted">${stop<7?`You stopped the attacker at <b style="color:var(--ecto)">${STAGES[stop].k}</b>. Every stage to the left is one the attacker reached first.`:"The attacker reached their goal this time. Here's where each stage could have been stopped."}</p></div>
  <ol class="chain" aria-label="Cyber Kill Chain">${STAGES.map((s,i)=>`<li class="${i<stop?"reached":i===stop?"stop":""}"><span class="n">${i===stop?"STOPPED HERE":"Stage "+(i+1)}</span><span class="k">${s.k}</span><span class="p">${s.p}</span></li>`).join("")}</ol>
  <div class="score">
    <div class="stat"><b>${pts} / ${max}</b><span>${team?"Team score":"Analyst score"}</span></div>
    <div class="stat"><b>${g2.hit} / ${g2.hit+g2.miss}</b><span>Suspicious rows found</span></div>
    <div class="stat"><b>${t[1].split(" (")[0]}</b><span>Your prize</span></div>
  </div>
  ${roster}
  ${onPoint(3)}
  <section class="reveal">
    <span class="eyebrow">Case file declassified · based on a real attack</span>
    <h2>${c.reveal.company}, ${c.reveal.year}</h2>
    <p>${c.reveal.summary}</p>
    <p class="lesson">${c.reveal.lesson}</p>
    <div class="ttps" aria-label="MITRE ATT&CK techniques">${c.reveal.ttps.map(x=>`<span class="ttp"><b>${x[0]}</b> ${x[1]}</span>`).join("")}</div>
    <p class="fineprint">MITRE ATT&amp;CK technique IDs shown above. Names, logs, and messages in this game are invented; the summary reflects public reporting.</p>
  </section>
  <p style="font-size:19px"><b>The takeaway:</b> most attackers don't break in. They log in.</p>
  ${team?boardHTML(at):""}
  <div class="btn-row"><button class="btn" data-a="home">${team?"Next team":"Next analyst"}</button><button class="btn btn-ghost" data-a="draw">${team?"Same team, new case":"Draw another case"}</button></div>`;
}

app.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el)return;
  const a=el.dataset.a, i=+el.dataset.i;
  if((a==="draw"||a==="pick")&&MODE==="team"&&document.getElementById("p0")){const t=readTeam(); if(!t)return; TEAM=t;}
  if((a==="draw"||a==="pick")&&MODE==="team"&&!TEAM){home();return;}
  if(a==="mode"){MODE=el.dataset.m; home(); if(MODE==="team")document.getElementById("tname")?.focus();}
  else if(a==="draw"){const pool=CASES.filter(c=>c.id!==lastId);start(pool[Math.floor(Math.random()*pool.length)].id);}
  else if(a==="pick")start(el.dataset.id);
  else if(a==="resetcount"){store("hs-analysts","0");store("hs-board","[]");home();}
  else if(a==="s1"&&S.s1===null){S.s1=i;station1();}
  else if(a==="to2"){station2();toTop();}
  else if(a==="flag"&&!S.s2done){S.flagged.has(i)?S.flagged.delete(i):S.flagged.add(i);station2();}
  else if(a==="sub2"){S.s2done=true;station2();}
  else if(a==="to3"){station3();toTop();}
  else if(a==="pick3"&&!S.s3done){if(S.picked.has(i))S.picked.delete(i);else if(S.picked.size<3)S.picked.add(i);station3();}
  else if(a==="sub3"){S.s3done=true;station3();}
  else if(a==="toR"){result();toTop();}
  else if(a==="home"){TEAM=null;home();toTop();}
});
app.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();e.target.click();
    const i=e.target.dataset.i; requestAnimationFrame(()=>{const r=app.querySelector(`.row[data-i="${i}"]`);if(r)r.focus();});}
});
home();
</script>

</body>
</html>
