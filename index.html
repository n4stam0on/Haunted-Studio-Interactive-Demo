<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Haunted Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Pirata+One&display=swap">
<style>
/* Layout: one security-console column. Header holds the studio badge and a 4-step station tracker; each station is one working panel. Deliberately single (dark) theme: a night-shift console. */
:root{
  --night:#17121f; --panel:#211a2c; --panel-2:#2b2238; --line:#3e3252;
  --bone:#efe6d8; --dim:#b2a7c3; --pumpkin:#f0883e; --pumpkin-ink:#1f1308;
  --ecto:#6fd3b5; --amber:#e9b949; --blood:#f0695e;
  --pumpkin-wash:rgba(240,136,62,.14); --ecto-wash:rgba(111,211,181,.13); --blood-wash:rgba(240,105,94,.14); --amber-wash:rgba(233,185,73,.14);
  --f-display:"Pirata One", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--bone)}
body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:17px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1060px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;color:var(--pumpkin);letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.steps li.done{color:var(--ecto);border-color:color-mix(in srgb,var(--ecto) 45%,transparent)}
.steps li.now{color:var(--pumpkin-ink);background:var(--pumpkin);border-color:var(--pumpkin);font-weight:600}

/* type */
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8vw,76px);line-height:.95;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.6vw,42px);line-height:1.05}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:66ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin)}
.muted{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack-lg{display:flex;flex-direction:column;gap:24px;min-width:0}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:17px;background:var(--pumpkin);color:var(--pumpkin-ink);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn-ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--dim)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.linkish{background:none;border:0;padding:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;font-family:var(--f-mono);font-size:13.5px;line-height:1.65;color:var(--dim)}
.brief b{color:var(--bone);font-weight:600}
.brief .alert{color:var(--blood)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s ease,background .15s ease}
.case:hover{border-color:var(--pumpkin);background:var(--panel-2)}
.case .file{font-family:var(--f-mono);font-size:12px;color:var(--dim);letter-spacing:.06em}
.case h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05}
.case p{font-size:15px;color:var(--dim)}
.pill{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.d-Easy{color:var(--ecto)} .d-Medium{color:var(--amber)} .d-Hard{color:var(--blood)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--bone)}

/* station panel */
.station-head{display:flex;flex-direction:column;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}

/* messages */
.msg{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.msg-meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.line b{font-family:var(--f-mono);font-size:13px;color:var(--pumpkin);padding-top:2px}
.ehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ehead dt{color:var(--dim);font-family:var(--f-mono);font-size:12.5px;padding-top:2px}
.ehead dd{margin:0;overflow-wrap:anywhere}
.attach{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start}
.bubble{background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:34ch;overflow-wrap:anywhere}
.bubble u{color:var(--amber)}
.chatname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--amber-wash);color:var(--amber)}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;transition:border-color .15s ease}
.choice:hover:not([disabled]){border-color:var(--pumpkin)}
.choice[disabled]{cursor:default}
.key{font-family:var(--f-mono);font-weight:600;font-size:13px;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.choice.v-best{border-color:var(--ecto);background:var(--ecto-wash)}
.choice.v-bad.picked{border-color:var(--blood);background:var(--blood-wash)}
.choice.v-ok.picked{border-color:var(--amber);background:var(--amber-wash)}
.choice.dimmed{opacity:.55}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.best{background:var(--ecto-wash)} .fb.ok{background:var(--amber-wash)} .fb.bad{background:var(--blood-wash)}
.verdict{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.best .verdict{color:var(--ecto)} .ok .verdict{color:var(--amber)} .bad .verdict{color:var(--blood)}

/* logs */
.logwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--night)}
table.logs{border-collapse:collapse;width:100%;min-width:760px;font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.logs th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.logs td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.logs tr:last-child td{border-bottom:0}
.row{cursor:pointer;transition:background .12s ease}
.row:hover{background:var(--panel)}
.row.sel{background:var(--pumpkin-wash)}
.row.sel td:first-child .box{background:var(--pumpkin);border-color:var(--pumpkin);color:var(--pumpkin-ink)}
.box{width:20px;height:20px;border:1.5px solid var(--dim);border-radius:5px;display:grid;place-items:center;font-size:13px;line-height:1}
.graded .row{cursor:default}
.row.hit{background:var(--ecto-wash)} .row.miss{background:var(--amber-wash)} .row.false{background:var(--blood-wash)}
.why td{font-family:var(--f-body);font-size:14.5px;color:var(--bone);padding-top:0;padding-bottom:12px}
.why .verdict{margin-right:8px}
.why.hit .verdict{color:var(--ecto)} .why.miss .verdict{color:var(--amber)} .why.false .verdict{color:var(--blood)}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:13.5px}
.tally span b{font-weight:600}

/* actions */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease}
.act:hover:not([disabled]){border-color:var(--pumpkin)}
.act.sel{border-color:var(--pumpkin);background:var(--pumpkin-wash)}
.act[disabled]{cursor:default}
.act.good.sel{border-color:var(--ecto);background:var(--ecto-wash)}
.act.badpick{border-color:var(--blood);background:var(--blood-wash)}
.act.missed{border-style:dashed;border-color:var(--ecto)}
.act .why2{font-size:14.5px;color:var(--dim)}
.picked-n{font-family:var(--f-mono);font-size:13px;color:var(--dim)}

/* result */
.chain{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.chain li{border-radius:10px;padding:10px 10px 12px;background:var(--panel-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.chain .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.chain .k{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.chain .p{font-size:12.5px;color:var(--dim);line-height:1.3}
.chain li.reached{background:var(--blood-wash);border-color:color-mix(in srgb,var(--blood) 50%,transparent)}
.chain li.reached .n{color:var(--blood)}
.chain li.stop{background:var(--ecto-wash);border:2px solid var(--ecto)}
.chain li.stop .n{color:var(--ecto)}
.score{display:flex;flex-wrap:wrap;gap:12px}
.stat{background:var(--panel-2);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:140px}
.stat b{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--dim)}
.reveal{background:var(--bone);color:var(--pumpkin-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.reveal .eyebrow{color:#9a4a12}
.reveal h2{color:var(--pumpkin-ink)}
.reveal p{color:#2b2233}
.reveal .lesson{font-weight:700}
.ttps{display:flex;flex-wrap:wrap;gap:8px}
.ttp{font-family:var(--f-mono);font-size:12.5px;background:#e3d7c4;color:#2b2233;border-radius:6px;padding:4px 8px}
.ttp b{font-weight:600}
.fineprint{font-size:13px;color:#5b5165}

/* team mode */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 16px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--bone)}
.teamform{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.field input{font:inherit;font-size:16px;color:var(--bone);background:var(--night);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
.field input:focus{outline:2px solid var(--amber);outline-offset:1px}
.formnote{grid-column:1/-1;font-size:14px;color:var(--dim)}
.formnote.err{color:var(--blood)}
.onpoint{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--pumpkin-wash);border-radius:12px;padding:12px 16px}
.onpoint .who{font-size:19px;font-weight:700}
.onpoint .role{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pumpkin)}
.onpoint p{flex-basis:100%;font-size:15px;color:var(--bone)}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.roster span{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:14.5px}
.roster i{font-style:normal;color:var(--dim);font-size:13px}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{text-align:left;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.board td{padding:9px 10px;border-bottom:1px solid var(--line)}
.board tr.you td{color:var(--pumpkin);font-weight:700}
.board td.num{font-family:var(--f-mono);text-align:right}
/* station 1 flags, notes, later picks */
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px;line-height:1.3;transition:border-color .15s ease}
.flag:hover{border-color:var(--pumpkin)}
.flag.sel{background:var(--pumpkin-wash);border-color:var(--pumpkin)}
.flag.sel::before{content:"⚑ ";color:var(--pumpkin)}
.flagres{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flagres summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.flaglist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.flaglist li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;font-size:14.5px}
.flaglist li span:last-child{color:var(--dim)}
.flaglist li.hit{background:var(--ecto-wash)} .flaglist li.hit .verdict{color:var(--ecto)}
.flaglist li.miss{background:var(--amber-wash)} .flaglist li.miss .verdict{color:var(--amber)}
.flaglist li.false{background:var(--blood-wash)} .flaglist li.false .verdict{color:var(--blood)}
.flaglist li.clean .verdict{color:var(--dim)}
.notes{background:var(--amber-wash);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.act.laterpick{border-color:var(--amber);background:var(--amber-wash)}
@media (max-width:820px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  .chain{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:minmax(0,1fr)}
}
/* message animations */
.typing{display:inline-flex;gap:5px;align-items:center;background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:13px 15px;align-self:flex-start}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:dots 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes dots{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.typing-label{font-size:13px;color:var(--dim);font-style:italic}
.pop{animation:pop .42s cubic-bezier(.2,.9,.3,1.35) both;transform-origin:bottom left}
@keyframes pop{from{opacity:0;transform:scale(.55) translateY(10px)}to{opacity:1;transform:none}}
.caret::after{content:"▍";color:var(--pumpkin);margin-left:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--blood)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blood);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.skiphint{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.msg.playing{cursor:pointer}
.wait{opacity:0;transition:opacity .45s ease}
.fadein{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Graveyard Games</b><span>Security Operations · Night Shift</span></div>
    <ol class="steps" id="steps" aria-label="Progress"></ol>
  </header>
  <main id="app" class="stack-lg" aria-live="polite"></main>
</div>

<script>
const STAGES=[
  {k:"Reconnaissance",p:"Scouting the target"},
  {k:"Weaponization",p:"Building the trap"},
  {k:"Delivery",p:"Sending the trap"},
  {k:"Exploitation",p:"Springing the trap"},
  {k:"Installation",p:"Moving in"},
  {k:"Command & Control",p:"Taking the controls"},
  {k:"Actions on Objectives",p:"Stealing the treasure"}
];

/* Option text "t" may be an array of wordings; one is picked at random each game. */
const CASES=[
{
  id:"caller", file:"CASE 0451", title:"The Midnight Caller", diff:"Easy",
  teaser:"A developer calls the help desk at midnight, locked out and desperate.",
  s1:{
    role:"You are working the help desk phone tonight.",
    msg:{type:"call", meta:"Help desk line · 11:48 PM", lines:[
      ["Caller","Hey, it's Marcus Vane from the engine team. I'm at the airport and I lost my phone, so I can't get my login code."],
      ["Caller","The launch build has to go out tonight or my lead is going to lose it. Can you reset my MFA and send the new code to this number instead?"]
    ]},
    flags:[
      {t:"He says it has to happen tonight or he's in trouble",r:true,w:"Pressure and deadlines rush people past their normal checks."},
      {t:"He wants the code sent to a new phone number",r:true,w:"A new number means the code goes to whoever is holding that phone, which may not be Marcus."},
      {t:"He has a reason you can't reach him on his usual phone",r:true,w:"\"I lost my phone\" conveniently blocks the easiest way to verify him."},
      {t:"He called the official help desk number",r:false,w:"Anyone can dial the help desk. That's normal, not a warning sign."},
      {t:"He gave his full name and his team",r:false,w:"Names and teams are easy to find on LinkedIn. Not a red flag, but not proof either."},
      {t:"He's asking for an MFA reset",r:false,w:"People really do lose phones. The request itself is normal; how you verify it is what matters."}
    ],
    q:"What do you do?",
    opts:[
      {t:["Reset it. He knows his name, his team, and details about the launch.","Go ahead with the reset, since he knows real details about the team and launch."],v:"bad",pts:0,f:"Knowing details proves nothing. Team names and launch dates are easy to find. A rushed reset hands the account to whoever is on the phone."},
      {t:["Confirm his employee ID and date of birth, then do the reset.","Ask for his employee ID and birthday to verify him before resetting."],v:"ok",pts:1,f:"Better than nothing, but that information turns up in data leaks and on social media. An attacker may already have it."},
      {t:["Call him back on the number listed in the company directory.","Hang up and call back using the number already on file for Marcus."],v:"best",pts:3,f:"Verifying through a channel you already trust is the move. If the caller is a fake, the real Marcus picks up and is confused. You could also confirm with his manager."},
      {t:["Send the reset link to his work email instead of the new number.","Skip the new number and email the reset to his company inbox."],v:"ok",pts:1,f:"Safer than texting a new number. But if his account is already compromised, the attacker reads that email too."}
    ]
  },
  s2:{
    source:"Identity provider · sign-in log",
    intro:"Someone else took the call last night and reset the MFA. Find the entries that show the attacker at work.",
    notes:[
      "Help desk policy: MFA resets require a callback to the number on file.",
      "j.cole is on approved vacation in Mexico City this week.",
      "Overnight staff connect through the company VPN, which shows up as Frankfurt, Germany.",

{
  id:"launcher", file:"CASE 0666", title:"The Cursed Launcher", diff:"Medium",
  teaser:"Players get an email from official support with a brand-new game launcher.",
  s1:{
    role:"You are a Graveyard Games player checking your inbox.",
    msg:{type:"email", from:"Graveyard Games Support &lt;support@graveyardgames.com&gt;", to:"you", subject:"Action required: install the new Graveyard Launcher", attach:null,
      body:"Hi Player, our old launcher will stop working this weekend. To keep your account and in-game items safe, download and install the new Graveyard Launcher from the link below before Friday."},
    flags:[
      {t:"It sets a deadline (\"before Friday\")",r:true,w:"Deadlines push you to act before you think."},
      {t:"It asks you to install software from an email link",r:true,w:"Real game updates come through the launcher or store you already use, not an email download."},
      {t:"It says your account and items are at risk",r:true,w:"Fear of losing something valuable is a classic pressure tactic."},
      {t:"It came from the real support@graveyardgames.com address",r:false,w:"The address is real, so by itself it isn't a red flag. That's what makes this attack dangerous."},
      {t:"It greets you as \"Player\" instead of your name",r:false,w:"Mass emails often say \"Player\". Real support does it too, so it doesn't tell you much."},
      {t:"It has the studio's normal logo and formatting",r:false,w:"Looking official isn't a warning sign, and it isn't proof either."}
    ],
    q:"What do you do?",
    opts:[
      {t:["Install it. The sender address is the studio's real support address.","Download it, since it really did come from official support."],v:"bad",pts:0,f:"A real address only proves which system sent it. If that system is compromised, the attacker sends from it too."},
      {t:["Check the official website and social accounts for a launcher announcement.","Look for the launcher news on the studio's official site and socials first."],v:"best",pts:3,f:"Confirming through a separate official channel catches a compromised sender. No announcement anywhere else is a big red flag."},
      {t:["Reply to support and ask whether the email is legitimate.","Hit reply and ask support to confirm the email is real."],v:"ok",pts:1,f:"Good instinct, but the reply goes to the same compromised system, so the attacker may answer you."},
      {t:["Scan the download with antivirus, then install it if it comes back clean.","Run the file through your antivirus first and install it only if it's clean."],v:"ok",pts:1,f:"Antivirus helps, but new or repackaged malware often isn't detected yet. A clean scan isn't a green light."}
    ]
  },
  s2:{
    source:"Support platform · admin activity log",
    intro:"Thousands of players got that email. Find the entries showing how the attacker used your support system.",
    notes:[
      "Vendor agents work from the Manila office and are not allowed to use personal VPNs.",
      "Support sends templated replies to large groups of players during outages.",
      "Official downloads only come from graveyardgames.com/download."
    ],
    cols:["Time","Account","Location","Device","Event","Result"],
    rows:[
      {c:["2:14 PM","agent.dana","San Antonio, TX","Office PC (known)","Sign in","Success"],s:false,w:"A support agent starting her shift."},
      {c:["2:30 PM","agent.dana","San Antonio, TX","Office PC (known)","Sent outage reply to 340 players","Success"],s:false,w:"The notes say templated outage replies are normal."},
      {c:["2:50 PM","vendor.oscar","Manila, Philippines","Vendor office PC (known)","Sign in","Success"],s:false,w:"An outsourced agent signing in from his normal office."},
      {c:["2:58 PM","vendor.oscar","Manila, Philippines","Vendor office PC (known)","Closed ticket #8790","Success"],s:false,w:"Normal support work."},
      {c:["3:02 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Sign in","Success"],s:true,w:"Same account, another continent 12 minutes later, on a VPN vendors aren't allowed to use."},
      {c:["3:03 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Opened admin settings: email templates","Success"],s:true,w:"Support agents answer tickets. Poking at admin settings is out of place."},
      {c:["3:05 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Created template \"New Launcher\"","Success"],s:true,w:"There's no launcher update. The attacker is writing the bait."},
      {c:["3:07 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Added link: files-graveyardgames.com/launcher.exe","Success"],s:true,w:"A lookalike domain. Official downloads only come from graveyardgames.com/download."},
      {c:["3:09 PM","vendor.oscar","Amsterdam (VPN service)","Unknown device","Bulk email sent to 48,000 players","Success"],s:true,w:"The trap going out to every player at once."},
      {c:["3:15 PM","agent.mia","San Antonio, TX","Office PC (known)","Sign in","Failed: password expired"],s:false,w:"Routine. Passwords expire."},
      {c:["3:16 PM","agent.mia","San Antonio, TX","Office PC (known)","Password changed","Success"],s:false,w:"Mia fixing her expired password."},
      {c:["3:30 PM","agent.dana","San Antonio, TX","Office PC (known)","Closed ticket #8812","Success"],s:false,w:"Normal support work."},
      {c:["3:40 PM","vendor.oscar","Manila, Philippines","Vendor office PC (known)","Closed ticket #8815","Success"],s:false,w:"This is the real Oscar, still working from Manila. Two places at once is your clue his login was stolen."}
    ]
  },
  s3:{
    intro:"The fake launcher steals saved passwords from players' computers. Pick your 3 first moves.",
    acts:[
      {t:"End all of vendor.oscar's sessions and reset his password",g:"now",w:"Cuts the attacker out of your support system."},
      {t:"Block the lookalike download link",g:"now",w:"Stops new victims, even if some players still click."},
      {t:"Warn players on official channels: don't run it, reset passwords, turn on MFA",g:"now",w:"Protects the people who already got the email."},
      {t:"Review which other vendor accounts can send bulk email",g:"later",w:"Smart cleanup, but first stop the active damage."},
      {t:"Offer account recovery help to affected players",g:"later",w:"Kind and useful once the bleeding has stopped."},
      {t:"Shut down the support system for good",g:"bad",w:"An overreaction. Contain the one bad account; players still need support."},
      {t:"Ask players to reply with their passwords so you can check their accounts",g:"bad",w:"Never ask for passwords. That's exactly what attackers do."},
      {t:"Email all players a link to a \"fixed\" launcher",g:"bad",w:"A second surprise download email trains players to keep clicking. Point them to the official site instead."}
    ]
  },
  s4:{
    opts:[
      {t:"An attacker used a vendor's stolen support login to email 48,000 players a fake launcher that steals passwords. The account is disabled and the link is blocked. We're warning players to reset passwords and turn on MFA.",best:true,f:"Clear, accurate, includes what's done and what players should do."},
      {t:"Our support vendor accidentally sent a buggy launcher update to some players.",best:false,f:"It wasn't an accident or a bug. It was malware from an attacker."},
      {t:"48,000 player accounts were hacked.",best:false,f:"48,000 received the email. We don't know how many ran it. Overstating causes panic."},
      {t:"A phishing email went out, but everything is fine now.",best:false,f:"Players who ran the file are still at risk. \"Fine\" isn't true yet."}
    ]
  },
  reveal:{company:"2K Games",year:"2022",
    summary:"In September 2022, 2K said an unauthorized party got login details for a vendor's help desk platform and used it to email players a link. The download was malware disguised as a game launcher. Security researchers identified it as RedLine, a stealer that grabs saved passwords and browser data. 2K told players not to open the emails, to reset passwords, and to turn on MFA.",
    lesson:"A trusted sender can still be compromised. Confirm surprises through a separate official channel.",
    ttps:[["T1078","Valid Accounts"],["T1566.002","Spearphishing Link"],["T1204.002","Malicious File"],["T1555","Credentials from Password Stores"]]}
},
{
  id:"text", file:"CASE 1013", title:"The Text from Beyond", diff:"Easy",
  teaser:"An employee's phone buzzes: their account will be locked in 30 minutes.",
  s1:{
    role:"You are a producer at Graveyard Games. Your phone buzzes at 9:10 AM.",
    msg:{type:"sms", from:"+1 (415) 555-0199", time:"9:10 AM",
      text:"GRAVEYARD IT: Unusual activity detected. Your account will be LOCKED in 30 minutes. Verify now: <u>graveyard-games-it.help/verify</u>"},
    flags:[
      {t:"It threatens to lock your account in 30 minutes",r:true,w:"A countdown is designed to make you panic and click."},
      {t:"The link isn't the company's real web address",r:true,w:"graveyard-games-it.help is a lookalike. The real IT site lives on graveyardgames.com."},
      {t:"IT is texting you a login link",r:true,w:"Real IT teams don't send login links by text."},
      {t:"It starts with \"GRAVEYARD IT\"",r:false,w:"Anyone can type a name. It's not a warning sign by itself, and it's not proof either."},
      {t:"It arrived during work hours",r:false,w:"Timing during the workday is normal and tells you nothing."},
      {t:"It came from a U.S. phone number",r:false,w:"Phone numbers are easy to spoof or buy. The country doesn't make it safe or unsafe."}
    ],
    q:"What do you do?",
    opts:[
      {t:["Tap the link and log in quickly so your account isn't locked.","Sign in through the link right away to keep your account open."],v:"bad",pts:0,f:"The link leads to a fake login page that captures your password and code."},
      {t:["Don't tap it. Report the text through the official IT help desk.","Leave the link alone and report the text to IT through the usual help desk."],v:"best",pts:3,f:"You stay safe, and IT can warn everyone else who got the same text."},
      {t:["Delete the text and get on with your day.","Ignore it and delete the message."],v:"ok",pts:1,f:"You're safe, but security never learns that others got the same text. Reporting protects your coworkers."},
      {t:["Reply and ask which activity was flagged on your account.","Text back asking what the unusual activity was."],v:"bad",pts:0,f:"Replying tells the attacker your number is active, and they'll happily keep the conversation going."}
    ]
  },
  s2:{
    source:"Identity provider + web proxy · combined log",
    intro:"A coworker named Jordan did tap the link. Find the entries that show what happened next.",
    notes:[
      "The real IT site is graveyardgames.com/it-help.",
      "m.santos works remotely from Toronto, Canada.",
      "The company VPN exits through Frankfurt, Germany. VPN sign-ins come from known devices."
    ],
    cols:["Time","User","Location","Device","Event","Result"],
    rows:[
      {c:["8:40 AM","svc-backup","Data center","Backup server","Scheduled backup","Success"],s:false,w:"Routine automated job."},
      {c:["8:55 AM","j.okafor","San Antonio, TX","Windows laptop (known)","Sign in","Success"],s:false,w:"Jordan starting the workday normally."},
      {c:["9:02 AM","m.santos","Toronto, Canada","MacBook (known)","Sign in","Success"],s:false,w:"The notes say m.santos works from Toronto."},
      {c:["9:05 AM","r.patel","San Antonio, TX","Windows laptop (known)","Visited graveyardgames.com/it-help","Allowed"],s:false,w:"That's the real IT site."},
      {c:["9:12 AM","j.okafor","San Antonio, TX","iPhone (known)","Visited graveyard-games-it.help","Allowed"],s:true,w:"The lookalike domain from the text."},
      {c:["9:13 AM","j.okafor","San Antonio, TX","iPhone (known)","Approved MFA push","Success"],s:true,w:"Jordan approved a login prompt while on the fake page. The attacker was logging in at the same moment."},
      {c:["9:14 AM","j.okafor","Frankfurt, Germany (hosting provider)","Windows PC (new)","Sign in","Success"],s:true,w:"Same city as the VPN, but a hosting provider and a new device. Not the company VPN."},
      {c:["9:15 AM","j.okafor","Frankfurt, Germany (hosting provider)","Windows PC (new)","Created rule: forward all mail to an outside address","Success"],s:true,w:"A forwarding rule lets the attacker keep reading Jordan's email even after a password reset."},
      {c:["9:16 AM","j.okafor","Frankfurt, Germany (hosting provider)","Windows PC (new)","Opened \"2027 Release Calendar.xlsx\"","Success"],s:true,w:"Going straight for unannounced game plans."},
      {c:["9:20 AM","r.patel","San Antonio, TX","MacBook (known)","Sign in","Failed: wrong password"],s:false,w:"One typo..."},
      {c:["9:21 AM","r.patel","San Antonio, TX","MacBook (known)","Sign in","Success"],s:false,w:"...then a normal login."},
      {c:["9:25 AM","d.nguyen","Frankfurt (company VPN)","Windows laptop (known)","Sign in","Success"],s:false,w:"Company VPN with a known device. Same city as the attacker, but a normal login."},
      {c:["9:40 AM","j.okafor","San Antonio, TX","Windows laptop (known)","Opened Teams","Success"],s:false,w:"The real Jordan, still at work and unaware."}
    ]
  },
  s3:{
    intro:"Jordan's password and login were captured through a fake page. Pick your 3 first moves.",
    acts:[
      {t:"End Jordan's sessions and reset the password",g:"now",w:"Kicks out the attacker and makes the stolen password useless."},
      {t:"Delete the mail forwarding rule",g:"now",w:"Otherwise the attacker keeps getting Jordan's email even after the reset."},
      {t:"Block the lookalike domain for the whole company",g:"now",w:"Anyone else who taps the link hits a wall."},
      {t:"Warn all staff about the fake IT text",g:"later",w:"Important, and it comes right after you've cut off the active attacker."},
      {t:"Switch MFA to number matching so push approvals are harder to trick",g:"later",w:"A strong fix for the future, not a first move."},
      {t:"Remotely wipe Jordan's phone",g:"bad",w:"The phone wasn't infected; the password was typed into a fake site. Wiping destroys evidence."},
      {t:"Call out Jordan by name in the company chat",g:"bad",w:"Shame makes people hide mistakes. You want fast reporting."},
      {t:"Block all text messages on company phones",g:"bad",w:"Overkill that breaks real communication and doesn't remove the attacker."}
    ]
  },
  s4:{
    opts:[
      {t:"Jordan entered a password on a fake IT site from a text. The attacker logged in, set up email forwarding, and opened the 2027 release calendar. Access is cut off and the rule is removed. We're checking what was forwarded.",best:true,f:"Accurate, complete, and clear about what's still being checked."},
      {t:"Jordan fell for a scam and should be disciplined.",best:false,f:"Blame doesn't help leadership decide anything, and it discourages reporting."},
      {t:"Someone in Germany hacked our company VPN.",best:false,f:"The VPN wasn't involved. The attacker used Jordan's stolen password."},
      {t:"A spam text went around. No impact.",best:false,f:"The attacker read internal files and forwarded email. That's impact."}
    ]
  },
  reveal:{company:"Activision",year:"2022",

    lesson:"Real IT teams don't threaten you by text with a link. Report it so everyone else is warned.",
    ttps:[["T1660","Phishing (mobile)"],["T1078","Valid Accounts"],["T1114.003","Email Forwarding Rule"],["T1213","Data from Information Repositories"]]}

{
  id:"shield", file:"CASE 1031", title:"The Stolen Shield", diff:"Hard",
  teaser:"A friendly security teammate needs your code access token. Tonight.",
  s1:{
    role:"You are a developer on the anti-cheat team. A chat message pops up at 1:40 AM.",
    msg:{type:"chat", name:"Riley (Security Team)", tag:"External guest", channel:"Direct message",
      text:"Hi! Riley from security. We're rotating code repository keys tonight for the anti-cheat project. Paste your access token here so I can migrate you, or you'll lose access before the patch ships."},
    flags:[
      {t:"Riley is labeled \"External guest\"",r:true,w:"The real security team works for the company. Guests are outsiders."},
      {t:"It asks you to paste a secret token into chat",r:true,w:"Tokens work like passwords. No legitimate process collects them in chat."},
      {t:"It warns you'll lose access before the patch",r:true,w:"A threat plus a deadline is pressure, not process."},
      {t:"Rotating keys is a real security practice",r:false,w:"True, and that's why the story is believable. It isn't the warning sign."},
      {t:"The message is friendly and casual",r:false,w:"Plenty of real coworkers write like this."},
      {t:"It mentions the anti-cheat project by name",r:false,w:"Project names leak easily. Not a red flag, not proof."}
    ],
    q:"What do you do?",
    opts:[
      {t:["Paste it. Key rotation is normal and Riley knows the project.","Share the token. Rotating keys is standard and the details check out."],v:"bad",pts:0,f:"An access token is as good as your password. Anyone holding it can copy your code."},
      {t:["Don't respond. Report the message through the official security channel.","Ignore Riley and report the message to security through the normal channel."],v:"best",pts:3,f:"The real security team is never an outside guest, and nobody legitimate asks for tokens in chat."},
      {t:["Ask Riley to confirm your manager's name and the project code first.","Test Riley by asking for your manager's name and the project code."],v:"ok",pts:1,f:"Good instinct, but org charts are easy to find online. Verification has to happen outside this chat."},
      {t:["Create a brand-new token and share that instead of your main one.","Make a fresh token just for Riley so your main one stays private."],v:"bad",pts:0,f:"A new token opens the same doors. You've just made one specifically for the attacker."}
    ]
  },
  s2:{
    source:"Code repository · audit log",
    intro:"Another developer, Kai, fell for it. Find the entries showing the attacker at work.",
    notes:[
      "Kai often works past midnight.",
      "dev.priya works with the partner studio in Seoul, South Korea.",
      "The build server clones about 40 repositories every night.",
      "prod_keys.env holds passwords for live game servers."
    ],
    cols:["Time","User","Location","Device","Event","Result"],
    rows:[
      {c:["12:30 AM","ci-bot","Build server","Server","Scheduled build","Success"],s:false,w:"The automated build system."},
      {c:["1:12 AM","dev.sam","San Antonio, TX","Windows laptop (known)","Merged pull request","Success"],s:false,w:"Late-night work from a known person and device."},
      {c:["1:40 AM","dev.kai","San Antonio, TX","MacBook (known)","Sign in","Success"],s:false,w:"The notes say Kai often works late."},
      {c:["1:52 AM","dev.kai","San Antonio, TX","MacBook (known)","Created access token \"migration\"","Success"],s:true,w:"The subtle one: Kai made a new token right after \"Riley\" asked. This is where it started."},
      {c:["2:10 AM","dev.priya","Seoul, South Korea","MacBook (known)","Cloned repo game-ui","Success"],s:false,w:"The notes say Priya works with the Seoul studio. Known device, one repo."},
      {c:["2:30 AM","dev.ana","Austin, TX","MacBook (known)","Sign in (2 failures, then success)","Success"],s:false,w:"A couple of typos at 2:30 AM is very human."},
      {c:["2:47 AM","dev.kai","Cloud server (rented)","Script","Token \"migration\" used","Success"],s:true,w:"The new token used from a rented server, not Kai's laptop."},
      {c:["2:49 AM","dev.kai","Cloud server (rented)","Script","Cloned repo anticheat-core","Success"],s:true,w:"Going for anti-cheat code first. Cheat makers would pay for it."},
      {c:["2:53 AM","dev.kai","Cloud server (rented)","Script","Listed all repositories","Success"],s:true,w:"Mapping everything there is to take."},
      {c:["2:58 AM","dev.kai","Cloud server (rented)","Script","Cloned 214 repositories in 9 minutes","Success"],s:true,w:"Automated theft of almost everything."},
      {c:["3:05 AM","ci-bot","Build server","Server","Cloned 40 repositories for nightly build","Success"],s:false,w:"Looks like the theft, but the notes say this happens every night."},
      {c:["3:20 AM","dev.kai","Cloud server (rented)","Script","Read file prod_keys.env","Success"],s:true,w:"The attacker now has passwords for live game servers."},
      {c:["9:01 AM","dev.kai","San Antonio, TX","MacBook (known)","Sign in","Success"],s:false,w:"The real Kai arriving at work, unaware."}
    ]
  },
  s3:{
    intro:"The attacker copied your source code and is demanding a ransom. Pick your 3 first moves.",
    acts:[
      {t:"Revoke the \"migration\" token and all of Kai's tokens",g:"now",w:"Closes the door the attacker walked through."},
      {t:"Change the server passwords exposed in prod_keys.env",g:"now",w:"The attacker can use those against live servers. Rotate them immediately."},
      {t:"Bring in incident response and legal, and preserve the logs",g:"now",w:"Extortion is a crime. Experts and evidence shape every next decision."},
      {t:"Publish a statement about what was stolen",g:"later",w:"Being open builds trust, after you know the facts."},
      {t:"Block repository access from unknown cloud servers",g:"later",w:"A strong fix, but the revoked token already stops this attacker."},
      {t:"Pay the ransom so the code stays private",g:"bad",w:"Paying funds the next attack, and there's no guarantee they delete anything."},
      {t:"Delete the repositories so nothing else can be taken",g:"bad",w:"The copies are gone already. Deleting only destroys your own team's work."},
      {t:"Keep quiet and hope it never leaks",g:"bad",w:"Silence leaves players and staff unprepared."}
    ]
  },
  s4:{
    opts:[
      {t:"An attacker posing as a security teammate got a developer to create and share a code token. They copied 214 repositories, including anti-cheat, and read a file of live server passwords. The token is revoked, passwords are being changed, and IR and legal are engaged.",best:true,f:"Accurate, covers the biggest risk (live server passwords), and says what's being done."},

  {r:"Help Desk Lead"},{r:"Threat Hunter"},{r:"Incident Commander"},{r:"Communications Lead"}

const HUDDLE=[
  "Team huddle: what is being asked for, and what feels off? Everyone weighs in, then {n} makes the final calls.",

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function trained(){return parseInt(store("hs-analysts")||"0",10)||0}
function board(){try{return JSON.parse(store("hs-board")||"[]")||[]}catch(e){return []}}
function shuf(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function word(t,key){ if(!Array.isArray(t))return t; if(!(key in S.words))S.words[key]=Math.floor(Math.random()*t.length); return t[S.words[key]]; }

function teamForm(){
  const t=TEAM||{name:"",players:[]};

    <div class="field" style="grid-column:1/-1"><label for="tname">Team name</label><input id="tname" maxlength="28" placeholder="The Night Watch" value="${esc(t.name)}"></div>
    ${[0,1,2,3].map(i=>`<div class="field"><label for="p${i}">Analyst ${i+1}${i>1?" (optional)":""}</label><input id="p${i}" maxlength="20" placeholder="First name" value="${esc(t.players[i]||"")}"></div>`).join("")}
    <p class="formnote" id="tnote">Roles: Help Desk Lead, Threat Hunter, Incident Commander, Communications Lead. Each person leads a station; with fewer than 4, roles double up.</p>

}
function readTeam(){
  const players=[0,1,2,3].map(i=>(document.getElementById("p"+i)||{}).value||"").map(s=>s.trim()).filter(Boolean);

  if(players.length<2){ if(note){note.textContent="Add at least 2 analysts to play as a team.";note.classList.add("err");} document.getElementById("p"+players.length)?.focus(); return null; }
  const name=((document.getElementById("tname")||{}).value||"").trim()||"Team "+players[0];
  return {name,players};
}
function onPoint(i){
  if(MODE!=="team"||!TEAM)return "";

}
function boardHTML(highlight){
  const b=board().slice().sort((x,y)=>y.pts/y.max-x.pts/x.max||x.at-y.at).slice(0,5);

  ${b.map((r,i)=>`<tr class="${r.at===highlight?"you":""}"><td class="num" style="text-align:left">${i+1}</td><td>${esc(r.t)}</td><td>${esc(r.c)}</td><td class="num">${r.pts} / ${r.max}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}

function setSteps(i){

  stepsEl.hidden = i<0;

function toTop(){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}

function start(id){
  lastId=id;
  const c=CASES.find(x=>x.id===id);
  S={c, words:{},
     flags:new Set(), flagsDone:false, oF:shuf(c.s1.flags.length),
     s1:null, o1:shuf(c.s1.opts.length),
     flagged:new Set(), s2done:false,
     picked:new Set(), s3done:false, o3:shuf(c.s3.acts.length),
     s4:null, o4:shuf(c.s4.opts.length),
     introPlayed:false};
  station1(); toTop();

function msgHTML(m,anim){
  const skip=anim?`<span class="skiphint">Tap the message to skip</span>`:"";
  const H=anim?" hidden":"";
  if(m.type==="call") return `<div class="msg${anim?" playing":""}"><span class="msg-meta">${anim?`<span class="live">Live call</span> · `:"☎ "}${m.meta}</span>${m.lines.map(l=>`<div class="line"${H}><b>${l[0]}</b><span data-full="${esc(l[1])}">${anim?"":l[1]}</span></div>`).join("")}${skip}</div>`;
  if(m.type==="sms") return `<div class="msg${anim?" playing":""}"><span class="msg-meta">Text message · ${m.from} · ${m.time}</span>${anim?`<span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>`:""}<div class="bubble" data-pop${H}>${m.text}</div>${skip}</div>`;
  if(m.type==="chat") return `<div class="msg${anim?" playing":""}"><span class="msg-meta">${m.channel}</span><div class="chatname"><span class="avatar">R</span><b>${m.name}</b><span class="tag">${m.tag}</span></div>${anim?`<span class="typing-label">${m.name.split(" ")[0]} is typing…</span><span class="typing" aria-label="Typing"><i></i><i></i><i></i></span>`:""}<div class="bubble" data-pop${H}>${m.text}</div>${skip}</div>`;
  if(m.type==="email") return `<div class="msg"><span class="msg-meta">✉ Inbox</span><dl class="ehead"><dt>From</dt><dd>${m.from}</dd><dt>To</dt><dd>${m.to}</dd><dt>Subject</dt><dd><b>${m.subject}</b></dd></dl><p>${m.body}</p>${m.attach?`<span class="attach">📎 ${m.attach}</span>`:`<span class="attach">⬇ Download Graveyard Launcher</span>`}</div>`;
  return "";
}

function playIntro(){
  const msg=app.querySelector(".msg"), right=document.getElementById("s1right");
  if(!msg||!right)return;
  let done=false, iv=null; const timers=[];
  const later=(f,ms)=>timers.push(setTimeout(f,ms));
  right.classList.add("wait"); right.inert=true;
  function finish(){
    if(done)return; done=true;
    timers.forEach(clearTimeout); clearInterval(iv);
    msg.querySelectorAll(".line").forEach(l=>{l.hidden=false;const sp=l.querySelector("span");sp.textContent=sp.dataset.full;sp.classList.remove("caret");});
    msg.querySelectorAll(".typing,.typing-label,.skiphint").forEach(e=>e.remove());
    msg.querySelectorAll("[data-pop]").forEach(b=>{if(b.hidden){b.hidden=false;b.classList.add("pop");}});
    const live=msg.querySelector(".live"); if(live)live.classList.remove("live");
    msg.classList.remove("playing");
    right.inert=false; requestAnimationFrame(()=>right.classList.add("fadein"));
  }
  msg.addEventListener("click",finish);
  const lines=[...msg.querySelectorAll(".line")];
  if(lines.length){
    let li=0;
    const next=()=>{
      if(li>=lines.length){later(finish,350);return;}
      const L=lines[li], sp=L.querySelector("span"), full=sp.dataset.full; let ci=0;
      L.hidden=false; sp.classList.add("caret");
      iv=setInterval(()=>{
        ci+=1; sp.textContent=full.slice(0,ci);
        if(ci>=full.length){clearInterval(iv); sp.classList.remove("caret"); li++; later(next,550);}
      },26);
    };
    later(next,700);
  } else {
    later(()=>{
      msg.querySelectorAll(".typing,.typing-label").forEach(e=>e.remove());
      msg.querySelectorAll("[data-pop]").forEach(b=>{b.hidden=false;b.classList.add("pop");});
      later(finish,700);
    },1600);
  }
}

function gradeFlags(){
  const fl=S.c.s1.flags; let hit=0,miss=0,fa=0;
  fl.forEach((f,i)=>{const s=S.flags.has(i); if(f.r&&s)hit++; else if(f.r)miss++; else if(s)fa++;});
  return {hit,miss,fa,total:fl.filter(f=>f.r).length,pts:Math.max(0,hit-fa)};
}

function choicesHTML(opts,order,ans,action,keyPrefix,isBest,cls){
  return `<div class="choices">${order.map((i,pos)=>{
    const o=opts[i]; let c="choice";
    if(ans!==null){ c+=" "+cls(o); if(i===ans)c+=" picked"; else if(!isBest(o))c+=" dimmed"; }
    return `<button class="${c}" data-a="${action}" data-i="${i}" ${ans!==null?"disabled":""}><span class="key">${"ABCD"[pos]}</span><span>${word(o.t,keyPrefix+i)}</span></button>`}).join("")}</div>`;
}

function station1(){
  setSteps(0);
  const c=S.c, s=c.s1, ans=S.s1;
  const vLabel={best:"Best move",ok:"Partly safe",bad:"The ghost gets in"};
  const anim = !S.introPlayed && !S.flagsDone && s.msg.type!=="email" && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.introPlayed=true;
  let right;
  if(!S.flagsDone){
    right=`<div class="stack">
      <span class="eyebrow">Part A</span><h3>Spot the red flags</h3>
      <p class="muted" style="font-size:15px">Select every warning sign. Careful: some of these are normal details, and picking those costs points.</p>
      <div class="flags">${S.oF.map(i=>{const f=s.flags[i],on=S.flags.has(i);return `<button class="flag${on?" sel":""}" data-a="flag1" data-i="${i}" aria-pressed="${on}">${f.t}</button>`}).join("")}</div>
      <div class="btn-row"><button class="btn" data-a="subflags" ${S.flags.size?"":"disabled"}>Lock in red flags (${S.flags.size})</button></div>

  } else {

      <ul class="flaglist">${S.oF.map(i=>{const f=s.flags[i],on=S.flags.has(i);
        const st=f.r&&on?"hit":f.r?"miss":on?"false":"clean";
        const lab={hit:"Spotted",miss:"Missed",false:"Not a red flag",clean:"Normal detail"}[st];
        return `<li class="${st}"><span class="verdict">${lab}</span><b>${f.t}</b><span>${f.w}</span></li>`}).join("")}</ul></details>`;
    let after="";
    if(ans!==null){
      const o=s.opts[ans], best=s.opts.find(x=>x.v==="best");
      after=`<div class="fb ${o.v}"><span class="verdict">${vLabel[o.v]} · +${o.pts}</span><p>${o.f}</p></div>
        ${o.v!=="best"?`<div class="fb best"><span class="verdict">Best move</span><p>${best.f}</p></div>`:""}
        <div class="btn-row"><button class="btn" data-a="to2">Go to Station 2: Log Hunt</button></div>`;
    }
    right=`${flagRes}<div class="stack"><span class="eyebrow">Part B</span><h3>${s.q}</h3>
      ${choicesHTML(s.opts,S.o1,ans,"s1","s1-",o=>o.v==="best",o=>"v-"+o.v)}${after}</div>`;
  }
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · ${c.title} · Station 1</span><h2>The first contact</h2><p class="muted">${s.role}</p></div>
  ${onPoint(0)}
  <div class="two">
    ${msgHTML(s.msg,anim)}
    <div class="stack" id="s1right">${right}</div>
  </div>`;
  if(anim)playIntro();
}

function station2(){
  setSteps(1);
  const c=S.c, s=c.s2, done=S.s2done;
  const total=s.rows.filter(r=>r.s).length;
  let intro=s.intro;
  if(S.s1!==null && c.s1.opts[S.s1].v==="best") intro="You handled it well. But not everyone does. "+intro;
  const hint = c.diff==="Easy" ? ` <b style="color:var(--bone)">Hint: ${total} rows are suspicious.</b>` : ` <b style="color:var(--bone)">No hints on ${c.diff} cases. False alarms cost points.</b>`;
  let tally="";
  if(done){
    const g=grade2();
    tally=`<div class="tally"><span style="color:var(--ecto)">Caught <b>${g.hit}</b> of ${total}</span><span style="color:var(--amber)">Missed <b>${g.miss}</b></span><span style="color:var(--blood)">False alarms <b>${g.fa}</b></span></div>`;
  }
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Station 2</span><h2>Log Hunt</h2><p class="muted">${intro} Use the analyst notes, tap every suspicious row, then submit.${hint}</p></div>

  <div class="notes"><span class="msg-meta">Analyst notes</span><ul>${s.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>
  <div class="panel">
    <span class="msg-meta">${s.source}</span>
    <div class="logwrap"><table class="logs ${done?"graded":""}"><thead><tr><th><span aria-hidden="true">⚑</span></th>${s.cols.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${s.rows.map((r,i)=>{
      const sel=S.flagged.has(i);
      let st=""; if(done){ if(r.s&&sel)st="hit"; else if(r.s)st="miss"; else if(sel)st="false"; }
      const why = done && st ? `<tr class="why ${st}"><td></td><td colspan="${s.cols.length}"><span class="verdict">${st==="hit"?"Caught":st==="miss"?"Missed":"False alarm"}</span>${r.w}</td></tr>`:"";
      return `<tr class="row ${sel&&!done?"sel":""} ${st}" data-a="flag" data-i="${i}" tabindex="${done?-1:0}" role="checkbox" aria-checked="${sel}"><td><span class="box">${sel?"✓":""}</span></td>${r.c.map(x=>`<td>${x}</td>`).join("")}</tr>${why}`;
    }).join("")}
    </tbody></table></div>
    ${done?tally+`<div class="btn-row"><button class="btn" data-a="to3">Go to Station 3: Break the Chain</button></div>`
      :`<div class="btn-row"><button class="btn" data-a="sub2" ${S.flagged.size?"":"disabled"}>Submit findings (${S.flagged.size} flagged)</button></div>`}
  </div>`;
}
function grade2(){
  const rows=S.c.s2.rows; let hit=0,miss=0,fa=0;
  rows.forEach((r,i)=>{const f=S.flagged.has(i); if(r.s&&f)hit++; else if(r.s)miss++; else if(f)fa++;});
  const allowed = S.c.diff==="Easy"?1:0;
  return {hit,miss,fa,pts:Math.max(0,hit-fa),all:miss===0&&fa<=allowed};
}

function station3(){
  setSteps(2);
  const c=S.c, s=c.s3, done=S.s3done;
  const lab={now:["Good call","var(--ecto)"],later:["Right idea, wrong time","var(--amber)"],bad:["Makes it worse","var(--blood)"]};
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Station 3</span><h2>Break the Chain</h2><p class="muted">${s.intro} Some moves are smart but belong later. Only moves that stop the attack right now score.</p></div>
  ${onPoint(2)}
  <div class="panel">
    <div class="actions">${S.o3.map(i=>{
      const a=s.acts[i], sel=S.picked.has(i); let cls="act";
      if(done){ if(sel&&a.g==="now")cls+=" good sel"; else if(sel&&a.g==="later")cls+=" laterpick"; else if(sel)cls+=" badpick"; else if(a.g==="now")cls+=" missed"; }
      else if(sel)cls+=" sel";
      let label="";
      if(done){ if(sel)label=`<span class="verdict" style="color:${lab[a.g][1]}">${lab[a.g][0]}</span>`; else if(a.g==="now")label=`<span class="verdict" style="color:var(--ecto)">You missed this one</span>`; }
      return `<button class="${cls}" data-a="pick3" data-i="${i}" ${done?"disabled":""} aria-pressed="${sel}">${label}<b>${a.t}</b>${done&&(sel||a.g==="now")?`<span class="why2">${a.w}</span>`:""}</button>`}).join("")}
    </div>
    ${done?`<div class="btn-row"><button class="btn" data-a="to4">Go to Station 4: The Brief</button></div>`
      :`<div class="btn-row"><button class="btn" data-a="sub3" ${S.picked.size===3?"":"disabled"}>Lock in my 3 moves</button><span class="picked-n">${S.picked.size} of 3 chosen</span></div>`}
  </div>`;
}

function station4(){
  setSteps(3);
  const c=S.c, b=c.s4, ans=S.s4;
  let after="";
  if(ans!==null){
    const o=b.opts[ans], best=b.opts.find(x=>x.best);
    after=`<div class="fb ${o.best?"best":"bad"}"><span class="verdict">${o.best?"Ready to send · +2":"Not quite"}</span><p>${o.f}</p></div>
      ${o.best?"":`<div class="fb best"><span class="verdict">The one to send</span><p>${best.f}</p></div>`}
      <div class="btn-row"><button class="btn" data-a="toR">Reveal the real case</button></div>`;
  }
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Station 4</span><h2>The Brief</h2><p class="muted">The studio head has two minutes before a call with the publisher. Which summary do you send? Accurate beats dramatic.</p></div>
  ${onPoint(3)}
  <div class="panel">
    ${choicesHTML(b.opts,S.o4,ans,"s4","s4-",o=>o.best,o=>o.best?"v-best":"v-bad")}
    ${after}
  </div>`;
}

function result(){
  setSteps(4);
  const c=S.c, o1=c.s1.opts[S.s1], gF=gradeFlags(), g2=grade2();
  const good3=[...S.picked].filter(i=>c.s3.acts[i].g==="now").length;
  const brief=S.s4!==null&&c.s4.opts[S.s4].best?2:0;
  let stop;
  if(o1.v==="best"&&gF.miss===0&&gF.fa===0) stop=2; else if(g2.all) stop=4; else if(good3===3) stop=5; else stop=7;
  const sus=c.s2.rows.filter(r=>r.s).length;
  const pts=gF.pts+o1.pts+g2.pts+good3+brief, max=gF.total+3+sus+3+2;
  const tiers={2:["Stopped at the door","Full-size candy"],4:["Caught it moving in","Two fun-size pieces"],5:["Took back the controls","One fun-size piece"],7:["The ghost got away","Consolation candy"]};
  const t=tiers[stop];
  const team = MODE==="team" && TEAM;
  const n=trained()+(team?TEAM.players.length:1); store("hs-analysts",String(n));
  let at=null;
  if(team){ at=Date.now(); const b=board(); b.push({t:TEAM.name,c:c.title,pts,max,at}); store("hs-board",JSON.stringify(b.slice(-60))); }
  const roster = team ? `<div class="roster">${[0,1,2,3].map(i=>`<span>${esc(TEAM.players[i%TEAM.players.length])} <i>· ${ROLES[i].r}</i></span>`).join("")}</div>` : "";
  const stopWhy = stop===2?"You spotted every red flag and made the right call at first contact."
    : stop===4?"You caught the attacker's trail in the logs."
    : stop===5?"Your containment moves cut the attacker off."
    : "The attacker reached their goal this time.";
  app.innerHTML=`
  <div class="station-head"><span class="eyebrow">${c.file} · Debrief${team?" · "+esc(TEAM.name):""}</span><h2>${t[0]}</h2><p class="muted">${stopWhy} ${stop<7?`You stopped them at <b style="color:var(--ecto)">${STAGES[stop].k}</b>. Every stage to the left is one the attacker reached first.`:"Here's where each stage could have been stopped."}</p></div>
  <ol class="chain" aria-label="Cyber Kill Chain">${STAGES.map((s,i)=>`<li class="${i<stop?"reached":i===stop?"stop":""}"><span class="n">${i===stop?"STOPPED HERE":"Stage "+(i+1)}</span><span class="k">${s.k}</span><span class="p">${s.p}</span></li>`).join("")}</ol>
  <div class="score">
    <div class="stat"><b>${pts} / ${max}</b><span>${team?"Team score":"Analyst score"}</span></div>
    <div class="stat"><b>${gF.hit} / ${gF.total}</b><span>Red flags spotted</span></div>
    <div class="stat"><b>${g2.hit} / ${sus}</b><span>Suspicious rows found</span></div>
    <div class="stat"><b>${t[1]}</b><span>Your prize</span></div>
  </div>
  ${roster}
  <section class="reveal">
    <span class="eyebrow">Case file declassified · based on a real attack</span>
    <h2>${c.reveal.company}, ${c.reveal.year}</h2>
    <p>${c.reveal.summary}</p>
    <p class="lesson">${c.reveal.lesson}</p>
    <div class="ttps" aria-label="MITRE ATT&CK techniques">${c.reveal.ttps.map(x=>`<span class="ttp"><b>${x[0]}</b> ${x[1]}</span>`).join("")}</div>
    <p class="fineprint">MITRE ATT&amp;CK techniques used in this case file. Names, logs, and messages in this game are invented; the summary reflects public reporting.</p>
  </section>
  <p style="font-size:19px"><b>The takeaway:</b> most attackers don't break in. They log in.</p>
  ${team?boardHTML(at):""}
  <div class="btn-row"><button class="btn" data-a="home">${team?"Next team":"Next analyst"}</button><button class="btn btn-ghost" data-a="draw">${team?"Same team, new case":"Draw another case"}</button></div>`;
}

app.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el)return;
  const a=el.dataset.a, i=+el.dataset.i;
  if((a==="draw"||a==="pick")&&MODE==="team"&&document.getElementById("p0")){const t=readTeam(); if(!t)return; TEAM=t;}
  if((a==="draw"||a==="pick")&&MODE==="team"&&!TEAM){home();return;}
  if(a==="mode"){MODE=el.dataset.m; home(); if(MODE==="team")document.getElementById("tname")?.focus();}
  else if(a==="draw"){const pool=CASES.filter(c=>c.id!==lastId);start(pool[Math.floor(Math.random()*pool.length)].id);}
  else if(a==="pick")start(el.dataset.id);
  else if(a==="resetcount"){store("hs-analysts","0");store("hs-board","[]");home();}
  else if(a==="flag1"&&!S.flagsDone){S.flags.has(i)?S.flags.delete(i):S.flags.add(i);station1();}
  else if(a==="subflags"){S.flagsDone=true;station1();}
  else if(a==="s1"&&S.s1===null){S.s1=i;station1();}
  else if(a==="to2"){station2();toTop();}
  else if(a==="flag"&&!S.s2done){S.flagged.has(i)?S.flagged.delete(i):S.flagged.add(i);station2();}
  else if(a==="sub2"){S.s2done=true;station2();}
  else if(a==="to3"){station3();toTop();}
  else if(a==="pick3"&&!S.s3done){if(S.picked.has(i))S.picked.delete(i);else if(S.picked.size<3)S.picked.add(i);station3();}
  else if(a==="sub3"){S.s3done=true;station3();}
  else if(a==="to4"){station4();toTop();}
  else if(a==="s4"&&S.s4===null){S.s4=i;station4();}
  else if(a==="toR"){result();toTop();}
  else if(a==="home"){TEAM=null;home();toTop();}
});
app.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){e.preventDefault();e.target.click();
    const i=e.target.dataset.i; requestAnimationFrame(()=>{const r=app.querySelector(`.row[data-i="${i}"]`);if(r)r.focus();});}
});
home();
</script>

</body>
</html>
